<script>
/* ============================================================
   PRISMA Gestão Operacional — PGO 5.0
   Melhorias de interface: Matrícula em Usuários + detalhamento de
   "Em Análise" por duas colunas na Análise de SAC.
   ============================================================ */
(function() {
  'use strict';

  var MelhoriasPGO5 = window.MelhoriasPGO5 = window.MelhoriasPGO5 || {};

  // ========================================================================
  // MATRÍCULA — SOMENTE NA ÁREA DE GESTÃO DE USUÁRIOS
  // ========================================================================

  MelhoriasPGO5.podeVerMatricula = function() {
    return !!(window.AcessoPGO5 && (
      AcessoPGO5.podeNaInterface('gerenciarEquipe') ||
      AcessoPGO5.podeNaInterface('gerenciarUsuariosTodos')
    ));
  };

  if (window.Pages && Pages.usuariosPGO5) {
    var usuarios = Pages.usuariosPGO5;

    // A lista usa o endpoint enriquecido, que preserva o mesmo escopo do
    // endpoint oficial e só acrescenta a matrícula ao resultado autorizado.
    usuarios.render = function(container) {
      var self = this;
      container = container || self._alvo();
      self.state.salvando = false;

      container.innerHTML = self._cabecalho() +
        '<div class="card">' + Components.emptyState('group', 'Carregando usuários...') + '</div>';

      google.script.run
        .withSuccessHandler(function(dados) {
          self.state.dados = dados || { usuarios: [], cargos: [], niveis: [] };
          self._pintar();
        })
        .withFailureHandler(function(err) {
          container.innerHTML = self._cabecalho() + '<div class="card">' +
            Components.emptyState('lock', 'Você não tem acesso a esta tela.',
              App.escapeHtml((err && err.message) || '')) + '</div>';
        })
        .listarUsuariosPGO5ComMatricula();
    };

    var pintarUsuariosOriginal = usuarios._pintar;
    usuarios._pintar = function() {
      pintarUsuariosOriginal.apply(this, arguments);
      if (!MelhoriasPGO5.podeVerMatricula()) return;

      var alvo = this._alvo();
      if (!alvo) return;
      var tabela = alvo.querySelector('.pgo5cfg-tabela');
      if (!tabela) return;

      var cabecalho = tabela.querySelector('thead tr');
      if (cabecalho && !cabecalho.querySelector('[data-pgo5-matricula]')) {
        var th = document.createElement('th');
        th.setAttribute('data-pgo5-matricula', '1');
        th.textContent = 'Matrícula';
        cabecalho.insertBefore(th, cabecalho.firstChild);
      }

      var linhas = tabela.querySelectorAll('tbody tr');
      var lista = (this.state.dados && this.state.dados.usuarios) || [];
      Array.prototype.forEach.call(linhas, function(tr, i) {
        if (tr.querySelector('[data-pgo5-matricula]')) return;
        var td = document.createElement('td');
        td.setAttribute('data-pgo5-matricula', '1');
        td.textContent = (lista[i] && lista[i].matricula) ? lista[i].matricula : '-';
        tr.insertBefore(td, tr.firstChild);
      });
    };

    var abrirUsuarioOriginal = usuarios._abrirFormulario;
    usuarios._abrirFormulario = function(usuario) {
      abrirUsuarioOriginal.call(this, usuario);
      if (!MelhoriasPGO5.podeVerMatricula()) return;

      var nome = document.getElementById('pgo5usr-nome');
      if (!nome || document.getElementById('pgo5usr-matricula')) return;
      var grupoNome = nome.parentNode;
      if (!grupoNome || !grupoNome.parentNode) return;

      var bloco = document.createElement('div');
      bloco.className = 'form-group';
      bloco.innerHTML = '<label class="form-label" for="pgo5usr-matricula">Matrícula</label>' +
        '<input class="form-control" id="pgo5usr-matricula" type="text" maxlength="50" ' +
        'autocomplete="off" value="' + App.escapeHtml((usuario && usuario.matricula) || '') + '">' +
        '<small class="pgo5cfg-nota">Identificador interno. Zeros à esquerda são preservados.</small>';
      grupoNome.parentNode.insertBefore(bloco, grupoNome);
    };

    var chamarUsuarioOriginal = usuarios._chamar;
    usuarios._chamar = function(funcao, args, mensagemOk) {
      if (funcao === 'salvarUsuarioPGO5' && MelhoriasPGO5.podeVerMatricula()) {
        var campo = document.getElementById('pgo5usr-matricula');
        if (args && args[0]) args[0].matricula = campo ? String(campo.value || '') : '';
        funcao = 'salvarUsuarioPGO5ComMatricula';
      }
      return chamarUsuarioOriginal.call(this, funcao, args, mensagemOk);
    };
  }

  // ========================================================================
  // ANÁLISE DE SAC — DUAS COLUNAS PARA DETALHAR "EM ANÁLISE"
  // ========================================================================

  MelhoriasPGO5.chaveColunasSac = 'PGO5_DETALHE_SAC_COLUNAS';

  MelhoriasPGO5.lerColunasSalvas = function() {
    try {
      var raw = localStorage.getItem(MelhoriasPGO5.chaveColunasSac);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  };

  MelhoriasPGO5.salvarColunasSac = function(c1, c2) {
    try {
      localStorage.setItem(MelhoriasPGO5.chaveColunasSac,
        JSON.stringify({ coluna1: c1 || '', coluna2: c2 || '' }));
    } catch (e) { /* preferência local nunca bloqueia a análise */ }
  };

  MelhoriasPGO5.htmlDetalheSac = function() {
    return '<div class="card" id="pgo5-sac-detalhe" style="margin-top:16px;">' +
      '<div class="card-header"><div class="card-title">' +
      '<span class="material-icons">table_view</span>Detalhar casos Em Análise</div></div>' +
      '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">' +
      'Escolha duas colunas da planilha de origem. O resultado respeita o mesmo período acima ' +
      'e traz somente os registros classificados como <strong>Em Análise</strong>. ' +
      'Exemplo: <strong>Data + Número do caso</strong>.</p>' +
      '<div id="pgo5-sac-detalhe-controles">' +
      '<button type="button" class="btn btn-secondary" id="pgo5-sac-carregar-colunas">' +
      '🔎 Escolher colunas</button></div>' +
      '<div id="pgo5-sac-detalhe-resultado" style="margin-top:14px;"></div>' +
      '</div>';
  };

  MelhoriasPGO5.ligarDetalheSac = function() {
    var botao = document.getElementById('pgo5-sac-carregar-colunas');
    if (botao) botao.addEventListener('click', MelhoriasPGO5.carregarColunasSac);
  };

  MelhoriasPGO5.carregarColunasSac = function() {
    var botao = document.getElementById('pgo5-sac-carregar-colunas');
    if (botao) { botao.disabled = true; botao.textContent = '🔎 Lendo colunas...'; }

    google.script.run
      .withSuccessHandler(function(resp) {
        MelhoriasPGO5.renderSeletoresSac(resp || {});
      })
      .withFailureHandler(function(err) {
        if (botao) { botao.disabled = false; botao.textContent = '🔎 Escolher colunas'; }
        Components.toast((err && err.message) || 'Não foi possível ler as colunas.', 'error');
      })
      .getColunasDetalhamentoAnaliseSac();
  };

  MelhoriasPGO5.renderSeletoresSac = function(resp) {
    var container = document.getElementById('pgo5-sac-detalhe-controles');
    if (!container) return;
    var colunas = resp.colunas || [];
    if (!resp.habilitado || !colunas.length) {
      container.innerHTML = '<div style="font-size:13px;color:var(--text-secondary);">' +
        'Nenhuma coluna disponível. Confira a fonte configurada da Análise de SAC.</div>';
      return;
    }

    var salvo = MelhoriasPGO5.lerColunasSalvas();
    var primeira = salvo.coluna1 || resp.colunaData || colunas[0];
    var segunda = salvo.coluna2 || '';

    if (!segunda || colunas.indexOf(segunda) === -1 || segunda === primeira) {
      // Prioriza cabeçalhos típicos de número do caso/protocolo.
      segunda = colunas.find(function(c) {
        return c !== primeira && /(caso|protocolo|n[uú]mero|numero|ticket|id)/i.test(c);
      }) || colunas.find(function(c) { return c !== primeira; }) || '';
    }

    var opcoes = function(selecionado) {
      return colunas.map(function(c) {
        return '<option value="' + App.escapeHtml(c) + '"' +
          (c === selecionado ? ' selected' : '') + '>' + App.escapeHtml(c) + '</option>';
      }).join('');
    };

    container.innerHTML = '<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">' +
      '<div class="form-group" style="margin:0;min-width:220px;">' +
      '<label class="form-label" for="pgo5-sac-coluna1">Coluna 1</label>' +
      '<select class="form-control" id="pgo5-sac-coluna1">' + opcoes(primeira) + '</select></div>' +
      '<div class="form-group" style="margin:0;min-width:220px;">' +
      '<label class="form-label" for="pgo5-sac-coluna2">Coluna 2</label>' +
      '<select class="form-control" id="pgo5-sac-coluna2">' + opcoes(segunda) + '</select></div>' +
      '<button type="button" class="btn btn-primary" id="pgo5-sac-filtrar-detalhe">Filtrar Em Análise</button>' +
      '</div>';

    var filtrar = document.getElementById('pgo5-sac-filtrar-detalhe');
    if (filtrar) filtrar.addEventListener('click', MelhoriasPGO5.buscarDetalheSac);
  };

  MelhoriasPGO5.buscarDetalheSac = function() {
    var c1 = document.getElementById('pgo5-sac-coluna1');
    var c2 = document.getElementById('pgo5-sac-coluna2');
    var coluna1 = c1 ? c1.value : '';
    var coluna2 = c2 ? c2.value : '';
    if (!coluna1 || !coluna2) {
      Components.toast('Escolha as duas colunas.', 'warning');
      return;
    }
    if (coluna1 === coluna2) {
      Components.toast('Escolha duas colunas diferentes.', 'warning');
      return;
    }

    MelhoriasPGO5.salvarColunasSac(coluna1, coluna2);
    var periodo = (Pages.indicadoresOperacionais.state || {}).periodo || {};
    var resultado = document.getElementById('pgo5-sac-detalhe-resultado');
    var botao = document.getElementById('pgo5-sac-filtrar-detalhe');
    if (botao) { botao.disabled = true; botao.textContent = 'Buscando...'; }
    if (resultado) resultado.innerHTML = Components.emptyState('query_stats', 'Buscando casos em análise...');

    google.script.run
      .withSuccessHandler(function(resp) {
        if (botao) { botao.disabled = false; botao.textContent = 'Filtrar Em Análise'; }
        MelhoriasPGO5.renderResultadoSac(resp || {});
      })
      .withFailureHandler(function(err) {
        if (botao) { botao.disabled = false; botao.textContent = 'Filtrar Em Análise'; }
        if (resultado) resultado.innerHTML = Components.emptyState('error_outline',
          'Não foi possível carregar o detalhamento.', App.escapeHtml((err && err.message) || ''));
      })
      .getDetalhamentoEmAnaliseSac({
        inicio: periodo.inicio || '',
        fim: periodo.fim || '',
        coluna1: coluna1,
        coluna2: coluna2
      });
  };

  MelhoriasPGO5.renderResultadoSac = function(resp) {
    var container = document.getElementById('pgo5-sac-detalhe-resultado');
    if (!container) return;
    var linhas = resp.linhas || [];
    if (!linhas.length) {
      container.innerHTML = Components.emptyState('inbox',
        'Nenhum caso Em Análise encontrado no período selecionado.');
      return;
    }

    var html = '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;' +
      'font-size:12.5px;color:var(--text-secondary);margin-bottom:8px;">' +
      '<span><strong>' + App.formatNumber(resp.total || 0) + '</strong> caso(s) Em Análise</span>' +
      (resp.limitado ? '<span>Exibindo os primeiros ' + App.formatNumber(resp.limite || linhas.length) + '.</span>' : '') +
      '</div>';
    html += '<div class="pgo5cfg-scroll"><table class="pgo5cfg-tabela"><thead><tr>' +
      '<th>' + App.escapeHtml(resp.coluna1 || 'Coluna 1') + '</th>' +
      '<th>' + App.escapeHtml(resp.coluna2 || 'Coluna 2') + '</th>' +
      '</tr></thead><tbody>';
    linhas.forEach(function(linha) {
      html += '<tr><td>' + App.escapeHtml(linha.coluna1 || '-') + '</td>' +
        '<td>' + App.escapeHtml(linha.coluna2 || '-') + '</td></tr>';
    });
    html += '</tbody></table></div>';
    container.innerHTML = html;
  };

  if (window.Pages && Pages.indicadoresOperacionais) {
    var renderConteudoOriginal = Pages.indicadoresOperacionais._renderConteudo;
    Pages.indicadoresOperacionais._renderConteudo = function(dados) {
      renderConteudoOriginal.call(this, dados);
      if (!dados || !dados.habilitado || !dados.datas) return;
      var conteudo = document.getElementById('indop-conteudo');
      if (!conteudo || document.getElementById('pgo5-sac-detalhe')) return;
      conteudo.insertAdjacentHTML('beforeend', MelhoriasPGO5.htmlDetalheSac());
      MelhoriasPGO5.ligarDetalheSac();
    };
  }
})();
</script>
