<script>
/* ============================================================
   PRISMA Gestão Operacional — PGO 5.0
   Arquivo: AcessoPGO5.html

   RESPONSABILIDADE
   As três telas de acesso: Usuários, Cargos e Níveis de Acesso —
   incluindo o editor de permissões de cada nível.

   ⚠️ CARGO ≠ NÍVEL
     Cargo  → a função organizacional da pessoa (o que ela É).
     Nível  → o que ela PODE fazer. É daqui que sai a permissão.

   ⚠️ ESCONDER BOTÃO NÃO É SEGURANÇA
   Tudo o que esta tela oculta é apenas conforto visual. Cada gravação é
   revalidada no servidor por exigirPermissao_() — ver Pgo5Permissoes.gs.
   ============================================================ */

var AcessoPGO5 = {

  /**
   * Diz se o usuário logado tem uma permissão.
   *
   * Lê a lista que veio no bootstrap. Serve só para decidir o que mostrar;
   * a decisão que vale é a do servidor.
   *
   * @param {string} permissao Chave da permissão.
   * @returns {boolean} true quando a interface pode exibir o recurso.
   */
  podeNaInterface: function(permissao) {
    var acesso = App.acessoPGO5 || {};
    return (acesso.permissoes || []).indexOf(permissao) !== -1;
  },

  /**
   * Permissões que liberam cada tela — FONTE ÚNICA do PGO 5.0.
   *
   * POR QUE ESTE MAPA EXISTE
   * A mesma lista vivia em três lugares: no data-pgo5-permissoes de cada item
   * do menu (Index.html), na guarda de entrada de cada tela e na definição das
   * seções de Configurações. Três cópias da mesma regra saem de sincronia — e
   * saíram: o menu Configurações não listava 'alterarPermissoes', então quem
   * tinha exatamente essa permissão (e só ela) via a seção Segurança existir
   * sem nunca conseguir chegar até ela. É a mesma classe de defeito que faz
   * uma funcionalidade "sumir" para quem tem direito a ela.
   *
   * Lista VAZIA = tela livre para qualquer pessoa autenticada (Dashboard).
   * 'SECOES' = derivada das seções de Configurações, que já declaram a
   * permissão de cada uma; ver permissoesDeConfiguracoes.
   *
   * ⚠️ Isto decide o que APARECE. Quem decide o que acontece é o servidor,
   * que revalida cada chamada com exigirPermissao_ (Pgo5Permissoes.gs).
   */
  PERMISSOES_DA_TELA: {
    dashboard: [],
    novoAtendimento: ['criarAtendimento'],
    relatorios: ['relatoriosProprios', 'relatoriosEquipe', 'relatoriosTodos'],
    indicadores: ['produtividadeEquipe', 'produtividadeTodos'],
    indicadoresOperacionais: ['analiseSac'],
    configuracoes: 'SECOES'
  },

  /**
   * Permissões que liberam uma tela.
   * @param {string} pagina Identificador técnico (data-page).
   * @returns {string[]} Lista; vazia quando a tela não é restrita.
   */
  permissoesDaTela: function(pagina) {
    var regra = this.PERMISSOES_DA_TELA[pagina];
    if (regra === 'SECOES') return this.permissoesDeConfiguracoes();
    return regra || [];
  },

  /**
   * União das permissões de todas as seções de Configurações.
   *
   * Derivada em tempo de chamada (e não de carga) porque ConfiguracoesPGO5 é
   * incluído depois deste arquivo. Toda seção nova entra aqui sozinha — que é
   * exatamente o que impede a lista do menu de envelhecer.
   *
   * @returns {string[]} Permissões que dão acesso a alguma seção.
   */
  permissoesDeConfiguracoes: function() {
    var secoes = ((window.Pages || {}).configuracoesPGO5 || {}).SECOES || [];
    var todas = [];
    secoes.forEach(function(secao) {
      (secao.permissoes || []).forEach(function(permissao) {
        if (todas.indexOf(permissao) === -1) todas.push(permissao);
      });
    });
    return todas;
  },

  /**
   * Diz se a interface deve abrir uma tela para o usuário logado.
   * @param {string} pagina Identificador técnico (data-page).
   * @returns {boolean} true quando a tela pode ser exibida.
   */
  podeVerTela: function(pagina) {
    var exigidas = this.permissoesDaTela(pagina);
    if (!exigidas.length) return true;
    var self = this;
    return exigidas.some(function(permissao) { return self.podeNaInterface(permissao); });
  },

  /** Permissões que abrem a EDIÇÃO de um atendimento (qualquer escopo). */
  PERMISSOES_DE_EDICAO: ['editarProprios', 'editarEquipe', 'editarTodos'],

  /** Permissões que permitem EXCLUIR um atendimento (qualquer escopo). */
  PERMISSOES_DE_EXCLUSAO: ['excluirProprios', 'excluirEquipe', 'excluirTodos'],

  /**
   * Diz se a pessoa pode, em ALGUM escopo, executar uma ação sobre
   * atendimentos. Serve para decidir se o botão aparece.
   *
   * Qual REGISTRO ela pode tocar continua sendo decisão do servidor: o
   * escopo (próprios / equipe / todos) é aplicado lá, a cada gravação. Aqui
   * só evitamos oferecer um botão que a pessoa nunca conseguiria usar.
   *
   * @param {string} acao 'editar' ou 'excluir'.
   * @returns {boolean} true quando a ação faz sentido para esta pessoa.
   */
  podeAgirEmAtendimento: function(acao) {
    var lista = acao === 'excluir' ? this.PERMISSOES_DE_EXCLUSAO : this.PERMISSOES_DE_EDICAO;
    var self = this;
    return lista.some(function(permissao) { return self.podeNaInterface(permissao); });
  },

  /**
   * Diz se uma NAVEGAÇÃO pode acontecer.
   *
   * ⚠️ UMA ROTA, DUAS AÇÕES
   * 'novoAtendimento' é a tela de criar E a de editar: o Dashboard abre a
   * edição por ela, passando o id do atendimento. Cobrar 'criarAtendimento'
   * na edição tiraria o botão Editar de quem tem só permissão de editar —
   * pessoa que pode corrigir o próprio atendimento, mas não abrir um novo.
   * Quem decide é a AÇÃO, não o nome da rota.
   *
   * O escopo (próprios / equipe / todos) continua sendo do servidor: ele
   * recusa a gravação sobre um registro fora do alcance da pessoa.
   *
   * @param {string} pagina Identificador técnico (data-page).
   * @param {string} [idDoRegistro] Preenchido quando a rota abre em edição.
   * @returns {boolean} true quando a navegação é permitida.
   */
  podeAbrirRota: function(pagina, idDoRegistro) {
    if (pagina === 'novoAtendimento' && idDoRegistro) {
      var self = this;
      return this.PERMISSOES_DE_EDICAO.some(function(p) { return self.podeNaInterface(p); });
    }
    return this.podeVerTela(pagina);
  }
};

/* ============================================================
   Pages.usuariosPGO5 — cadastro de pessoas
   ============================================================ */
Pages.usuariosPGO5 = {
  state: { dados: null, salvando: false },

  /**
   * Abre a tela de Usuários.
   * @param {HTMLElement} container Elemento <main id="app">.
   */

  /**
   * Devolve o elemento onde esta tela deve desenhar.
   *
   * A tela tem dois lugares possíveis: dentro de Configurações (existe o slot
   * "pgo5cfg-externo", e o menu de Configurações continua visível ao lado) ou
   * sozinha, ocupando o <main id="app">. O alvo é recalculado a cada uso
   * porque o repintar acontece depois de chamadas assíncronas, quando o
   * usuário já pode ter trocado de tela.
   *
   * @returns {HTMLElement} Elemento que receberá o HTML.
   */
  _alvo: function() {
    return document.getElementById('pgo5cfg-externo') || document.getElementById('app');
  },

  /**
   * Diz se a tela está embutida em Configurações.
   *
   * Embutida, ela não repete o título da página (Configurações já o exibe) e
   * coloca o botão de criação no cabeçalho do próprio card.
   *
   * @returns {boolean} true quando existe o slot de Configurações.
   */
  _embutido: function() {
    return !!document.getElementById('pgo5cfg-externo');
  },

  render: function(container) {
    var self = this;
    container = container || self._alvo();
    self.state.salvando = false;

    container.innerHTML = self._cabecalho() +
      '<div class="card">' + Components.emptyState('group', 'Carregando usuários...') + '</div>';

    google.script.run
      .withSuccessHandler(function(dados) {
        self.state.dados = dados || { usuarios: [], cargos: [], niveis: [] };
        self._pintar();
      })
      .withFailureHandler(function(err) {
        container.innerHTML = self._cabecalho() + '<div class="card">' +
          Components.emptyState('lock', 'Você não tem acesso a esta tela.',
            App.escapeHtml((err && err.message) || '')) + '</div>';
      })
      .listarUsuariosPGO5();
  },

  _cabecalho: function() {
    if (this._embutido()) return '';
    return '<div class="page-header"><div>' +
      '<h1 class="page-title">Usuários</h1>' +
      '<p class="page-subtitle">Quem acessa o sistema, com que cargo e com que nível de acesso.</p>' +
      '</div></div>';
  },

  /** Desenha a lista. */
  _pintar: function() {
    var self = this;
    var dados = self.state.dados;
    var container = self._alvo();
    var embutido = self._embutido();
    var botaoNovo = '<button class="btn btn-primary" id="pgo5usr-novo">+ Novo usuário</button>';

    var html = embutido ? '' : '<div class="page-header"><div>' +
      '<h1 class="page-title">Usuários</h1>' +
      '<p class="page-subtitle">Quem acessa o sistema, com que cargo e com que nível de acesso.</p></div>' +
      botaoNovo + '</div>';

    html += '<div class="card">';
    if (embutido) {
      html += '<div class="card-header"><div class="card-title">' +
        '<span class="material-icons">group</span>Usuários</div>' + botaoNovo + '</div>';
    }
    html += '<p class="pgo5cfg-ajuda">O <strong>cargo</strong> descreve a função da pessoa. ' +
      'Quem define o que ela pode fazer é o <strong>nível de acesso</strong>. ' +
      'O <strong>supervisor</strong> monta a hierarquia — é ele que define o que um gestor enxerga ' +
      '(a equipe é apenas uma informação organizacional).</p>';

    if (!dados.usuarios.length) {
      html += Components.emptyState('group', 'Nenhum usuário cadastrado.');
    } else {
      html += '<div class="pgo5cfg-scroll"><table class="pgo5cfg-tabela"><thead><tr>' +
        '<th>Nome</th><th>E-mail</th><th>Cargo</th><th>Nível de acesso</th>' +
        '<th>Supervisor</th><th>Equipe</th><th>Situação</th>' +
        '<th class="pgo5cfg-acoes-col">Ações</th></tr></thead><tbody>';
      dados.usuarios.forEach(function(usuario) {
        html += '<tr>';
        html += '<td><strong>' + App.escapeHtml(usuario.nome) + '</strong></td>';
        html += '<td>' + App.escapeHtml(usuario.email) + '</td>';
        html += '<td>' + App.escapeHtml(usuario.cargo) + '</td>';
        html += '<td>' + App.escapeHtml(usuario.nivelAcesso) + '</td>';
        html += '<td>' + App.escapeHtml(usuario.supervisor) + '</td>';
        html += '<td>' + App.escapeHtml(usuario.equipe || '-') + '</td>';
        html += '<td>' + (usuario.ativo
          ? '<span class="badge badge-success">Ativo</span>'
          : '<span class="badge badge-neutral">Inativo</span>') + '</td>';
        html += '<td class="pgo5cfg-acoes">' +
          '<button type="button" class="btn-icon pgo5usr-acao" data-acao="editar" data-id="' +
          App.escapeHtml(usuario.id) + '" title="Editar"><span class="material-icons">edit</span></button>' +
          '<button type="button" class="btn-icon pgo5usr-acao" data-acao="alternar" data-id="' +
          App.escapeHtml(usuario.id) + '" title="' + (usuario.ativo ? 'Desativar' : 'Ativar') + '">' +
          '<span class="material-icons">' + (usuario.ativo ? 'toggle_on' : 'toggle_off') + '</span></button>' +
          '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    container.innerHTML = html;
    self._ligarEventos();
  },

  _ligarEventos: function() {
    var self = this;
    var novo = document.getElementById('pgo5usr-novo');
    if (novo) novo.addEventListener('click', function() { self._abrirFormulario(null); });

    document.querySelectorAll('.pgo5usr-acao').forEach(function(botao) {
      botao.addEventListener('click', function() {
        var id = botao.getAttribute('data-id');
        var usuario = self.state.dados.usuarios.find(function(u) { return u.id === id; });
        if (!usuario) return;
        if (botao.getAttribute('data-acao') === 'editar') { self._abrirFormulario(usuario); return; }
        self._chamar('alterarSituacaoUsuarioPGO5', [id, !usuario.ativo],
          usuario.ativo ? 'Usuário desativado.' : 'Usuário reativado.');
      });
    });
  },

  /** Modal de criação/edição. */
  _abrirFormulario: function(usuario) {
    var self = this;
    var dados = self.state.dados;
    var u = usuario || {};
    var edicao = !!usuario;

    var body = '<div class="form-group"><label class="form-label" for="pgo5usr-nome">Nome <span class="required">*</span></label>' +
      '<input class="form-control" id="pgo5usr-nome" type="text" value="' + App.escapeHtml(u.nome || '') + '"></div>';
    body += '<div class="form-group"><label class="form-label" for="pgo5usr-email">E-mail da conta Google <span class="required">*</span></label>' +
      '<input class="form-control" id="pgo5usr-email" type="email" value="' + App.escapeHtml(u.email || '') + '"></div>';
    body += '<small class="pgo5cfg-nota">É o e-mail que identifica a pessoa. O PGO não usa senha própria.</small>';

    body += self._seletor('pgo5usr-cargo', 'Cargo', dados.cargos, u.cargoId, '— sem cargo —');
    body += self._seletor('pgo5usr-nivel', 'Nível de acesso', dados.niveis, u.nivelAcessoId, '— selecione —', true);
    body += '<small class="pgo5cfg-nota">O nível é o que concede as permissões. O cargo, não.</small>';

    var supervisores = (dados.usuarios || [])
      .filter(function(x) { return x.ativo && x.id !== u.id; })
      .map(function(x) { return { id: x.id, nome: x.nome }; });
    body += self._seletor('pgo5usr-supervisor', 'Supervisor', supervisores, u.supervisorId, '— sem supervisor —');
    body += '<small class="pgo5cfg-nota">Define a hierarquia: um gestor enxerga toda a árvore abaixo dele.</small>';

    body += '<div class="form-group"><label class="form-label" for="pgo5usr-equipe">Equipe</label>' +
      '<input class="form-control" id="pgo5usr-equipe" type="text" value="' + App.escapeHtml(u.equipe || '') + '"></div>';
    body += '<small class="pgo5cfg-nota">Apenas organizacional — a equipe NÃO concede acesso a nada.</small>';

    body += '<div class="form-group"><label class="pgo5-checkbox"><input type="checkbox" id="pgo5usr-ativo"' +
      (edicao ? (u.ativo ? ' checked' : '') : ' checked') + '> Ativo</label></div>';

    Components.modal({
      title: (edicao ? 'Editar' : 'Novo') + ' usuário',
      body: body,
      confirmText: 'Salvar',
      cancelText: 'Cancelar',
      onConfirm: function() {
        var payload = {
          nome: (document.getElementById('pgo5usr-nome') || {}).value || '',
          email: (document.getElementById('pgo5usr-email') || {}).value || '',
          cargoId: (document.getElementById('pgo5usr-cargo') || {}).value || '',
          nivelAcessoId: (document.getElementById('pgo5usr-nivel') || {}).value || '',
          supervisorId: (document.getElementById('pgo5usr-supervisor') || {}).value || '',
          equipe: (document.getElementById('pgo5usr-equipe') || {}).value || '',
          ativo: !!(document.getElementById('pgo5usr-ativo') || {}).checked
        };
        if (!payload.nome || !payload.email || !payload.nivelAcessoId) {
          Components.toast('Preencha nome, e-mail e nível de acesso.', 'warning');
          return false;   // mantém o modal aberto
        }
        self._chamar('salvarUsuarioPGO5', [payload, edicao ? u.id : ''],
          edicao ? 'Usuário atualizado.' : 'Usuário criado.');
      }
    });
  },

  /** Monta um <select> simples a partir de uma lista de { id, nome }. */
  _seletor: function(id, rotulo, itens, selecionado, textoVazio, obrigatorio) {
    var html = '<div class="form-group"><label class="form-label" for="' + id + '">' +
      rotulo + (obrigatorio ? ' <span class="required">*</span>' : '') + '</label>';
    html += '<select class="form-control" id="' + id + '">';
    html += '<option value="">' + App.escapeHtml(textoVazio) + '</option>';
    (itens || []).forEach(function(item) {
      html += '<option value="' + App.escapeHtml(item.id) + '"' +
        (String(selecionado || '') === item.id ? ' selected' : '') + '>' +
        App.escapeHtml(item.nome) + '</option>';
    });
    return html + '</select></div>';
  },

  /** Chama o backend e recarrega a lista. O sucesso só é anunciado depois. */
  _chamar: function(funcao, args, mensagemOk) {
    var self = this;
    if (self.state.salvando) return;
    self.state.salvando = true;
    Components.showLoading('Salvando...');

    var run = google.script.run
      .withSuccessHandler(function() {
        self.state.salvando = false;
        Components.hideLoading();
        Components.toast(mensagemOk, 'success');
        self.render();
      })
      .withFailureHandler(function(err) {
        self.state.salvando = false;
        Components.hideLoading();
        Components.toast(((err && err.message) || 'Não foi possível concluir a operação.'), 'error');
      });
    run[funcao].apply(run, args);
  }
};

/* ============================================================
   Pages.acessosPGO5 — Cargos e Níveis de Acesso
   ============================================================ */
Pages.acessosPGO5 = {
  state: { dados: null, aba: 'NIVEIS', salvando: false },

  /**
   * Nome de exibição de cada grupo de permissões.
   *
   * O servidor devolve o catálogo agrupado pela chave técnica do domínio
   * (PGO5_PERMISSOES em Pgo5Permissoes.gs). Aqui essa chave vira um texto em
   * português. Grupo novo criado no backend e ainda sem tradução aparece com
   * a própria chave — a tela não quebra.
   */
  ROTULO_GRUPO: {
    Atendimentos: 'Atendimentos próprios',
    Equipe: 'Atendimentos da equipe',
    Todos: 'Atendimentos de todos',
    Relatorios: 'Relatórios',
    Produtividade: 'Produtividade',
    SAC: 'Análise de SAC',
    Usuarios: 'Usuários',
    Configuracoes: 'Configurações',
    Seguranca: 'Segurança'
  },

  /**
   * Abre a tela de Cargos e Níveis.
   * @param {HTMLElement} container Elemento <main id="app">.
   */

  /**
   * Devolve o elemento onde esta tela deve desenhar.
   *
   * A tela tem dois lugares possíveis: dentro de Configurações (existe o slot
   * "pgo5cfg-externo", e o menu de Configurações continua visível ao lado) ou
   * sozinha, ocupando o <main id="app">. O alvo é recalculado a cada uso
   * porque o repintar acontece depois de chamadas assíncronas, quando o
   * usuário já pode ter trocado de tela.
   *
   * @returns {HTMLElement} Elemento que receberá o HTML.
   */
  _alvo: function() {
    return document.getElementById('pgo5cfg-externo') || document.getElementById('app');
  },

  /**
   * Diz se a tela está embutida em Configurações.
   *
   * Embutida, ela não repete o título da página (Configurações já o exibe) e
   * coloca o botão de criação no cabeçalho do próprio card.
   *
   * @returns {boolean} true quando existe o slot de Configurações.
   */
  _embutido: function() {
    return !!document.getElementById('pgo5cfg-externo');
  },

  render: function(container) {
    var self = this;
    container = container || self._alvo();
    self.state.salvando = false;

    container.innerHTML = self._cabecalho() +
      '<div class="card">' + Components.emptyState('badge', 'Carregando...') + '</div>';

    google.script.run
      .withSuccessHandler(function(dados) {
        self.state.dados = dados || { cargos: [], niveis: [], catalogoPermissoes: {} };
        self._pintar();
      })
      .withFailureHandler(function(err) {
        container.innerHTML = self._cabecalho() + '<div class="card">' +
          Components.emptyState('lock', 'Você não tem acesso a esta tela.',
            App.escapeHtml((err && err.message) || '')) + '</div>';
      })
      .getCargosENiveisPGO5();
  },

  _cabecalho: function() {
    if (this._embutido()) return '';
    return '<div class="page-header"><div>' +
      '<h1 class="page-title">Cargos e Níveis de Acesso</h1>' +
      '<p class="page-subtitle">O cargo diz o que a pessoa é. O nível diz o que ela pode.</p>' +
      '</div></div>';
  },

  _pintar: function() {
    var self = this;
    var dados = self.state.dados;
    var ehNiveis = self.state.aba === 'NIVEIS';
    var podeCriar = ehNiveis ? dados.podeGerenciarNiveis : dados.podeGerenciarCargos;

    var embutido = self._embutido();
    var botaoNovo = podeCriar ? '<button class="btn btn-primary" id="pgo5acc-novo">+ Novo ' +
      (ehNiveis ? 'nível' : 'cargo') + '</button>' : '';
    var abas = [['NIVEIS', 'Níveis de Acesso', 'security'], ['CARGOS', 'Cargos', 'badge']];

    var html = embutido ? '' : '<div class="page-header"><div>' +
      '<h1 class="page-title">Cargos e Níveis de Acesso</h1>' +
      '<p class="page-subtitle">O cargo diz o que a pessoa é. O nível diz o que ela pode.</p></div>' +
      botaoNovo + '</div>';

    // Embutida em Configurações já existe um menu à esquerda; repetir outro
    // menu lateral aqui dentro confundiria. Nesse caso as duas listas viram
    // abas horizontais dentro do próprio card.
    if (embutido) {
      html += '<div class="card"><div class="card-header"><div class="pgo5acc-abas">';
      abas.forEach(function(item) {
        html += '<button class="pgo5acc-aba' + (self.state.aba === item[0] ? ' active' : '') +
          '" data-aba="' + item[0] + '"><span class="material-icons">' + item[2] + '</span>' +
          '<span>' + item[1] + '</span></button>';
      });
      html += '</div>' + botaoNovo + '</div>';
    } else {
      html += '<div class="config-layout"><aside class="config-nav">';
      abas.forEach(function(item) {
        html += '<button class="config-nav-item' + (self.state.aba === item[0] ? ' active' : '') +
          '" data-aba="' + item[0] + '"><span class="material-icons">' + item[2] + '</span>' +
          '<span>' + item[1] + '</span></button>';
      });
      html += '</aside><section class="card config-content">';
    }

    if (ehNiveis) {
      if (!embutido) html += '<div class="card-header"><div class="card-title">' +
        '<span class="material-icons">security</span>Níveis de Acesso</div></div>';
      html += '<p class="pgo5cfg-ajuda">O nível de acesso define o que o usuário pode fazer. ' +
        'Alterar as permissões aqui muda o que TODOS os usuários daquele nível conseguem fazer.</p>';
      html += self._tabelaNiveis();
    } else {
      if (!embutido) html += '<div class="card-header"><div class="card-title">' +
        '<span class="material-icons">badge</span>Cargos</div></div>';
      html += '<p class="pgo5cfg-ajuda">Cargo representa a função organizacional. ' +
        'Ele <strong>não concede permissão</strong> — quem concede é o nível de acesso.</p>';
      html += self._tabelaCargos();
    }

    html += embutido ? '</div>' : '</section></div>';
    self._alvo().innerHTML = html;
    self._ligarEventos();
  },

  _tabelaCargos: function() {
    var dados = this.state.dados;
    if (!dados.cargos.length) return Components.emptyState('badge', 'Nenhum cargo cadastrado.');

    var html = '<div class="pgo5cfg-scroll"><table class="pgo5cfg-tabela"><thead><tr>' +
      '<th>Ordem</th><th>Cargo</th><th>Situação</th>' +
      '<th class="pgo5cfg-acoes-col">Ações</th></tr></thead><tbody>';
    dados.cargos.forEach(function(cargo, i) {
      html += '<tr><td>' + (cargo.ordem || i + 1) + '</td>' +
        '<td><strong>' + App.escapeHtml(cargo.nome) + '</strong></td>' +
        '<td>' + (cargo.ativo ? '<span class="badge badge-success">Ativo</span>'
          : '<span class="badge badge-neutral">Inativo</span>') + '</td>' +
        '<td class="pgo5cfg-acoes">' +
        '<button type="button" class="btn-icon pgo5acc-acao" data-tipo="CARGO" data-acao="editar" data-id="' +
        App.escapeHtml(cargo.id) + '" title="Editar"><span class="material-icons">edit</span></button>' +
        '<button type="button" class="btn-icon pgo5acc-acao" data-tipo="CARGO" data-acao="alternar" data-id="' +
        App.escapeHtml(cargo.id) + '" title="' + (cargo.ativo ? 'Desativar' : 'Ativar') + '">' +
        '<span class="material-icons">' + (cargo.ativo ? 'toggle_on' : 'toggle_off') + '</span></button>' +
        '</td></tr>';
    });
    return html + '</tbody></table></div>';
  },

  _tabelaNiveis: function() {
    var dados = this.state.dados;
    if (!dados.niveis.length) return Components.emptyState('security', 'Nenhum nível cadastrado.');

    var html = '<div class="pgo5cfg-scroll"><table class="pgo5cfg-tabela"><thead><tr>' +
      '<th>Ordem</th><th>Nível</th><th>Permissões</th><th>Situação</th>' +
      '<th class="pgo5cfg-acoes-col">Ações</th></tr></thead><tbody>';
    dados.niveis.forEach(function(nivel, i) {
      html += '<tr><td>' + (nivel.ordem || i + 1) + '</td>' +
        '<td><strong>' + App.escapeHtml(nivel.nome) + '</strong></td>' +
        '<td>' + nivel.permissoes.length + '</td>' +
        '<td>' + (nivel.ativo ? '<span class="badge badge-success">Ativo</span>'
          : '<span class="badge badge-neutral">Inativo</span>') + '</td>' +
        '<td class="pgo5cfg-acoes">' +
        '<button type="button" class="btn-icon pgo5acc-acao" data-tipo="NIVEL" data-acao="editar" data-id="' +
        App.escapeHtml(nivel.id) + '" title="Editar permissões"><span class="material-icons">tune</span></button>' +
        '<button type="button" class="btn-icon pgo5acc-acao" data-tipo="NIVEL" data-acao="alternar" data-id="' +
        App.escapeHtml(nivel.id) + '" title="' + (nivel.ativo ? 'Desativar' : 'Ativar') + '">' +
        '<span class="material-icons">' + (nivel.ativo ? 'toggle_on' : 'toggle_off') + '</span></button>' +
        '</td></tr>';
    });
    return html + '</tbody></table></div>';
  },

  _ligarEventos: function() {
    var self = this;
    // Duas aparências para a mesma troca de lista: menu lateral (tela cheia)
    // ou abas horizontais (embutida em Configurações).
    document.querySelectorAll('[data-aba]').forEach(function(botao) {
      botao.addEventListener('click', function() {
        self.state.aba = botao.getAttribute('data-aba');
        self._pintar();
      });
    });
    var novo = document.getElementById('pgo5acc-novo');
    if (novo) novo.addEventListener('click', function() {
      if (self.state.aba === 'NIVEIS') self._abrirFormularioNivel(null);
      else self._abrirFormularioCargo(null);
    });

    document.querySelectorAll('.pgo5acc-acao').forEach(function(botao) {
      botao.addEventListener('click', function() {
        var tipo = botao.getAttribute('data-tipo');
        var id = botao.getAttribute('data-id');
        var lista = tipo === 'CARGO' ? self.state.dados.cargos : self.state.dados.niveis;
        var item = lista.find(function(x) { return x.id === id; });
        if (!item) return;

        if (botao.getAttribute('data-acao') === 'editar') {
          if (tipo === 'CARGO') self._abrirFormularioCargo(item);
          else self._abrirFormularioNivel(item);
          return;
        }
        // Alternar situação reenvia o registro com o Ativo trocado.
        if (tipo === 'CARGO') {
          self._chamar('salvarCargoPGO5',
            [{ nome: item.nome, ordem: item.ordem, ativo: !item.ativo }, item.id], 'Cargo atualizado.');
        } else {
          self._chamar('salvarNivelAcessoPGO5',
            [{ nome: item.nome, ordem: item.ordem, ativo: !item.ativo }, item.id], 'Nível atualizado.');
        }
      });
    });
  },

  _abrirFormularioCargo: function(cargo) {
    var self = this;
    var c = cargo || {};
    var body = '<div class="form-group"><label class="form-label" for="pgo5acc-nome">Nome do cargo <span class="required">*</span></label>' +
      '<input class="form-control" id="pgo5acc-nome" type="text" value="' + App.escapeHtml(c.nome || '') + '"></div>';
    body += '<div class="form-group"><label class="form-label" for="pgo5acc-ordem">Ordem</label>' +
      '<input class="form-control" id="pgo5acc-ordem" type="number" min="0" value="' +
      App.escapeHtml(String(c.ordem || '')) + '"></div>';
    body += '<div class="form-group"><label class="pgo5-checkbox"><input type="checkbox" id="pgo5acc-ativo"' +
      (cargo ? (c.ativo ? ' checked' : '') : ' checked') + '> Ativo</label></div>';
    body += '<small class="pgo5cfg-nota">Cargo é rótulo organizacional: nada aqui altera o acesso de ninguém.</small>';

    Components.modal({
      title: (cargo ? 'Editar' : 'Novo') + ' cargo',
      body: body, confirmText: 'Salvar', cancelText: 'Cancelar',
      onConfirm: function() {
        var nome = (document.getElementById('pgo5acc-nome') || {}).value || '';
        if (!nome) { Components.toast('Informe o nome do cargo.', 'warning'); return false; }
        self._chamar('salvarCargoPGO5', [{
          nome: nome,
          ordem: (document.getElementById('pgo5acc-ordem') || {}).value || '',
          ativo: !!(document.getElementById('pgo5acc-ativo') || {}).checked
        }, cargo ? c.id : ''], cargo ? 'Cargo atualizado.' : 'Cargo criado.');
      }
    });
  },

  /** Modal do nível, com o editor de permissões agrupado por domínio. */
  _abrirFormularioNivel: function(nivel) {
    var self = this;
    var n = nivel || { permissoes: [] };
    var catalogo = self.state.dados.catalogoPermissoes || {};
    var podeEditarPermissoes = self.state.dados.podeAlterarPermissoes;

    var body = '<div class="form-group"><label class="form-label" for="pgo5acc-nome">Nome do nível <span class="required">*</span></label>' +
      '<input class="form-control" id="pgo5acc-nome" type="text" value="' + App.escapeHtml(n.nome || '') + '"></div>';
    body += '<div class="form-group"><label class="form-label" for="pgo5acc-ordem">Ordem</label>' +
      '<input class="form-control" id="pgo5acc-ordem" type="number" min="0" value="' +
      App.escapeHtml(String(n.ordem || '')) + '"></div>';
    body += '<div class="form-group"><label class="pgo5-checkbox"><input type="checkbox" id="pgo5acc-ativo"' +
      (nivel ? (n.ativo ? ' checked' : '') : ' checked') + '> Ativo</label></div>';

    body += '<h4 class="pgo5acc-titulo-permissoes">Permissões</h4>';
    if (!podeEditarPermissoes) {
      body += '<p class="pgo5cfg-ajuda">Você pode editar o nome e a situação, mas não as permissões.</p>';
    }
    // Um bloco por domínio — o catálogo vem do servidor, então acrescentar
    // uma permissão nova no backend faz a tela se ajustar sozinha.
    Object.keys(catalogo).forEach(function(grupo) {
      body += '<fieldset class="pgo5acc-grupo"><legend>' +
        App.escapeHtml(self.ROTULO_GRUPO[grupo] || grupo) + '</legend>';
      Object.keys(catalogo[grupo]).forEach(function(chave) {
        var marcada = (n.permissoes || []).indexOf(chave) !== -1;
        body += '<label class="pgo5-checkbox pgo5acc-permissao">' +
          '<input type="checkbox" class="pgo5acc-check" value="' + App.escapeHtml(chave) + '"' +
          (marcada ? ' checked' : '') + (podeEditarPermissoes ? '' : ' disabled') + '> ' +
          App.escapeHtml(catalogo[grupo][chave]) + '</label>';
      });
      body += '</fieldset>';
    });

    Components.modal({
      title: (nivel ? 'Editar' : 'Novo') + ' nível de acesso',
      body: body, confirmText: 'Salvar', cancelText: 'Cancelar',
      onConfirm: function() {
        var nome = (document.getElementById('pgo5acc-nome') || {}).value || '';
        if (!nome) { Components.toast('Informe o nome do nível.', 'warning'); return false; }

        var payload = {
          nome: nome,
          ordem: (document.getElementById('pgo5acc-ordem') || {}).value || '',
          ativo: !!(document.getElementById('pgo5acc-ativo') || {}).checked
        };
        // Sem permissão para editar a lista, ela nem é enviada: assim o
        // servidor preserva exatamente o que o nível já tinha.
        if (podeEditarPermissoes) {
          payload.permissoes = Array.prototype.slice
            .call(document.querySelectorAll('.pgo5acc-check'))
            .filter(function(c) { return c.checked; })
            .map(function(c) { return c.value; });
        }
        self._chamar('salvarNivelAcessoPGO5', [payload, nivel ? n.id : ''],
          nivel ? 'Nível atualizado.' : 'Nível criado.');
      }
    });
  },

  _chamar: function(funcao, args, mensagemOk) {
    var self = this;
    if (self.state.salvando) return;
    self.state.salvando = true;
    Components.showLoading('Salvando...');

    var run = google.script.run
      .withSuccessHandler(function() {
        self.state.salvando = false;
        Components.hideLoading();
        Components.toast(mensagemOk, 'success');
        // Sem argumento: a tela se redesenha onde já estava (dentro de
        // Configurações ou em tela cheia). Passar o <main> aqui apagaria o
        // menu de Configurações depois de cada gravação.
        self.render();
      })
      .withFailureHandler(function(err) {
        self.state.salvando = false;
        Components.hideLoading();
        Components.toast(((err && err.message) || 'Não foi possível concluir a operação.'), 'error');
      });
    run[funcao].apply(run, args);
  }
};

/* ============================================================
   Pages.segurancaPGO5 — PIN administrativo, bloqueios e auditoria

   ⚠️ O QUE ESTA TELA NUNCA MOSTRA
   Hash, salt, Script Properties ou o próprio PIN. Ela só sabe se existe
   PIN, quem está bloqueado e até quando a liberação vale — tudo vindo de
   obterEstadoSegurancaPGO5().

   ⚠️ O CONTADOR DE 5 MINUTOS AQUI É DECORATIVO
   Quem decide se a liberação vale é o servidor, a cada chamada. O que a
   tela mostra serve para o usuário saber que precisa se apressar, não
   para autorizar coisa alguma. Ver Pgo5Seguranca.gs.
   ============================================================ */
Pages.segurancaPGO5 = {
  state: { dados: null, salvando: false },

  /** Onde desenhar: o slot de Configurações ou o <main> inteiro. */
  _alvo: function() {
    return document.getElementById('pgo5cfg-externo') || document.getElementById('app');
  },

  /** true quando a tela está embutida em Configurações. */
  _embutido: function() {
    return !!document.getElementById('pgo5cfg-externo');
  },

  /**
   * Abre a tela de Segurança.
   * @param {HTMLElement} [container] Destino; por padrão, o alvo calculado.
   */
  render: function(container) {
    var self = this;
    container = container || self._alvo();
    self.state.salvando = false;

    container.innerHTML = '<div class="card">' +
      Components.emptyState('lock', 'Carregando informações de segurança...') + '</div>';

    google.script.run
      .withSuccessHandler(function(dados) {
        self.state.dados = dados || {};
        self._pintar();
      })
      .withFailureHandler(function(err) {
        self._alvo().innerHTML = '<div class="card">' +
          Components.emptyState('lock', 'Você não tem acesso a esta tela.',
            App.escapeHtml((err && err.message) || '')) + '</div>';
      })
      .obterEstadoSegurancaPGO5();
  },

  /** Desenha o conteúdo com o estado já carregado. */
  _pintar: function() {
    var self = this;
    var dados = self.state.dados;

    var html = '<div class="card">';
    html += '<div class="card-header"><div class="card-title">' +
      '<span class="material-icons">lock</span>Segurança</div></div>';
    html += '<p class="pgo5cfg-ajuda">O <strong>PIN administrativo</strong> é uma segunda ' +
      'camada para as ações mais sensíveis. Ele não substitui o login — quem entra no ' +
      'sistema continua sendo a sua Conta Google.</p>';

    // ── Estado do PIN ──
    html += '<div class="pgo5seg-bloco">';
    html += '<h4 class="pgo5acc-titulo-permissoes">PIN administrativo</h4>';
    if (dados.pinDefinido) {
      html += '<p class="pgo5seg-estado"><span class="badge badge-success">Definido</span> ' +
        'Depois de digitar o PIN correto, as ações protegidas ficam liberadas por ' +
        dados.minutosDeSessao + ' minutos.</p>';
      if (dados.sessaoAtiva) {
        html += '<p class="pgo5seg-estado"><span class="material-icons">lock_open</span> ' +
          'Liberado até <strong>' + App.escapeHtml(self._hora(dados.sessaoExpiraEm)) +
          '</strong>.</p>';
      } else {
        html += '<p class="pgo5seg-estado"><span class="material-icons">lock</span> ' +
          'Bloqueado no momento — as ações protegidas vão pedir o PIN.</p>';
      }
      html += '<div class="pgo5seg-acoes">' +
        '<button class="btn btn-primary" id="pgo5seg-validar">Informar PIN</button>' +
        '<button class="btn btn-secondary" id="pgo5seg-alterar">Alterar PIN</button></div>';
    } else {
      html += '<p class="pgo5seg-estado"><span class="badge badge-warning">Não definido</span> ' +
        'Enquanto não houver PIN, as ações protegidas ficam indisponíveis para todos.</p>';
      html += '<div class="pgo5seg-acoes">' +
        '<button class="btn btn-primary" id="pgo5seg-definir">Definir PIN</button></div>';
    }
    html += '</div>';

    // ── Recursos protegidos ──
    if ((dados.recursosProtegidos || []).length) {
      html += '<div class="pgo5seg-bloco">';
      html += '<h4 class="pgo5acc-titulo-permissoes">Links protegidos</h4>';
      html += '<p class="pgo5cfg-ajuda">O endereço só é buscado no servidor depois que o ' +
        'PIN é aceito. Ele não fica guardado nesta página.</p>';
      dados.recursosProtegidos.forEach(function(recurso) {
        html += '<div class="pgo5seg-recurso">' +
          '<span>' + App.escapeHtml(self.NOME_DO_RECURSO[recurso] || recurso) + '</span>' +
          '<button class="btn btn-secondary pgo5seg-link" data-recurso="' +
          App.escapeHtml(recurso) + '">Visualizar link</button></div>';
      });
      html += '</div>';
    }

    // ── Bloqueios ──
    html += '<div class="pgo5seg-bloco">';
    html += '<h4 class="pgo5acc-titulo-permissoes">Bloqueios por tentativa de PIN</h4>';
    html += '<p class="pgo5cfg-ajuda">Depois de ' + dados.tentativasPermitidas +
      ' tentativas erradas, o PIN daquele usuário fica bloqueado por ' +
      dados.horasDeBloqueio + ' horas. O bloqueio é individual.</p>';

    if (!(dados.bloqueados || []).length) {
      html += '<p class="pgo5seg-estado"><span class="material-icons">check_circle</span> ' +
        'Ninguém está bloqueado.</p>';
    } else {
      html += '<div class="pgo5cfg-scroll"><table class="pgo5cfg-tabela"><thead><tr>' +
        '<th>Usuário</th><th>Bloqueado até</th><th class="pgo5cfg-acoes-col">Ações</th>' +
        '</tr></thead><tbody>';
      dados.bloqueados.forEach(function(bloqueado) {
        html += '<tr><td><strong>' + App.escapeHtml(bloqueado.nome) + '</strong></td>' +
          '<td>' + App.escapeHtml(self._dataHora(bloqueado.bloqueadoAte)) + '</td>' +
          '<td class="pgo5cfg-acoes">' +
          '<button type="button" class="btn-icon pgo5seg-desbloquear" data-id="' +
          App.escapeHtml(bloqueado.id) + '" title="Desbloquear" aria-label="Desbloquear">' +
          '<span class="material-icons">lock_open</span></button></td></tr>';
      });
      html += '</tbody></table></div>';
    }

    // Recuperação: só faz sentido para o administrador único.
    if (dados.souOUnicoAdministrador) {
      html += '<p class="pgo5cfg-ajuda">Você é o <strong>único administrador ativo</strong>. ' +
        'Se bloquear o próprio PIN, não há outra pessoa para desbloquear — use a ' +
        'recuperação abaixo, que confere o seu e-mail e a conta Google conectada.</p>';
      html += '<div class="pgo5seg-acoes">' +
        '<button class="btn btn-secondary" id="pgo5seg-recuperar">Recuperar meu acesso</button>' +
        '</div>';
    }
    html += '</div>';

    // ── Auditoria ──
    html += '<div class="pgo5seg-bloco">';
    html += '<h4 class="pgo5acc-titulo-permissoes">Auditoria administrativa</h4>';
    html += '<p class="pgo5cfg-ajuda">Registro das ações administrativas. Consultas e ' +
      'leituras não entram aqui, e nenhum dado de cliente é guardado.</p>';
    html += '<div class="pgo5seg-acoes">' +
      '<button class="btn btn-secondary" id="pgo5seg-auditoria">Ver auditoria</button></div>';
    html += '<div id="pgo5seg-auditoria-lista"></div>';
    html += '</div>';

    html += '</div>';
    self._alvo().innerHTML = html;
    self._ligarEventos();
  },

  /** Nome legível de cada recurso protegido. */
  NOME_DO_RECURSO: {
    BANCO_PGO: 'Planilha do sistema (banco PGO)',
    FONTE_SAC: 'Planilha da Análise de SAC'
  },

  _ligarEventos: function() {
    var self = this;
    var ligar = function(id, acao) {
      var botao = document.getElementById(id);
      if (botao) botao.addEventListener('click', acao);
    };

    ligar('pgo5seg-definir', function() { self._abrirFormularioPin(false); });
    ligar('pgo5seg-alterar', function() { self._abrirFormularioPin(true); });
    ligar('pgo5seg-validar', function() { self._pedirPin(function() { self.render(); }); });
    ligar('pgo5seg-recuperar', function() { self._abrirRecuperacao(); });
    ligar('pgo5seg-auditoria', function() { self._carregarAuditoria(); });

    document.querySelectorAll('.pgo5seg-link').forEach(function(botao) {
      botao.addEventListener('click', function() {
        self._abrirLinkProtegido(botao.getAttribute('data-recurso'));
      });
    });
    document.querySelectorAll('.pgo5seg-desbloquear').forEach(function(botao) {
      botao.addEventListener('click', function() {
        self._chamar('desbloquearPinDeUsuarioPGO5', [botao.getAttribute('data-id')],
          'Usuário desbloqueado.');
      });
    });
  },

  /**
   * Modal de definição/alteração do PIN.
   *
   * O PIN digitado vai direto para o servidor e não é guardado em lugar
   * nenhum da página — nem em variável, nem em localStorage.
   *
   * @param {boolean} ehAlteracao true quando já existe PIN.
   */
  _abrirFormularioPin: function(ehAlteracao) {
    var self = this;
    var digitos = self.state.dados.digitosDoPin || 6;

    var body = '';
    if (ehAlteracao) {
      body += self._campoPin('pgo5seg-atual', 'PIN atual', digitos);
    }
    body += self._campoPin('pgo5seg-novo', 'Novo PIN', digitos);
    body += self._campoPin('pgo5seg-confirma', 'Confirme o novo PIN', digitos);
    body += '<small class="pgo5cfg-nota">Use exatamente ' + digitos + ' dígitos. ' +
      'Evite sequências óbvias como 000000 ou 123456. O PIN não pode ser recuperado — ' +
      'se for esquecido, será preciso defini-lo novamente.</small>';

    Components.modal({
      title: ehAlteracao ? 'Alterar PIN' : 'Definir PIN',
      body: body,
      confirmText: 'Salvar',
      cancelText: 'Cancelar',
      onConfirm: function() {
        var valor = function(id) {
          var campo = document.getElementById(id);
          return campo ? campo.value.trim() : '';
        };
        var payload = {
          pinAtual: ehAlteracao ? valor('pgo5seg-atual') : '',
          novoPin: valor('pgo5seg-novo'),
          confirmacao: valor('pgo5seg-confirma')
        };
        if (payload.novoPin.length !== digitos) {
          Components.toast('O PIN deve ter ' + digitos + ' dígitos.', 'warning');
          return false;
        }
        if (payload.novoPin !== payload.confirmacao) {
          Components.toast('A confirmação não confere.', 'warning');
          return false;
        }
        self._chamar('definirPinPGO5', [payload],
          ehAlteracao ? 'PIN alterado.' : 'PIN definido.');
      }
    });
  },

  /**
   * Pede o PIN e, dando certo, executa a ação seguinte.
   *
   * Serve tanto para o botão "Informar PIN" quanto para quando uma ação
   * protegida volta do servidor pedindo PIN.
   *
   * @param {Function} aoLiberar Executada depois de validar.
   * @param {string} [mensagem] Texto extra explicando por que o PIN é pedido.
   */
  _pedirPin: function(aoLiberar, mensagem) {
    var self = this;
    var digitos = (self.state.dados && self.state.dados.digitosDoPin) || 6;

    Components.modal({
      title: 'Informe o PIN administrativo',
      body: (mensagem ? '<p class="pgo5cfg-ajuda">' + App.escapeHtml(mensagem) + '</p>' : '') +
        self._campoPin('pgo5seg-pin', 'PIN', digitos) +
        '<small class="pgo5cfg-nota">Depois de aceito, as ações protegidas ficam ' +
        'liberadas por alguns minutos.</small>',
      confirmText: 'Validar',
      cancelText: 'Cancelar',
      onConfirm: function() {
        var campo = document.getElementById('pgo5seg-pin');
        var pin = campo ? campo.value.trim() : '';
        if (pin.length !== digitos) {
          Components.toast('O PIN deve ter ' + digitos + ' dígitos.', 'warning');
          return false;
        }
        Components.showLoading('Validando...');
        google.script.run
          .withSuccessHandler(function() {
            Components.hideLoading();
            Components.toast('PIN aceito.', 'success');
            if (typeof aoLiberar === 'function') aoLiberar();
          })
          .withFailureHandler(function(err) {
            Components.hideLoading();
            Components.toast(((err && err.message) || 'Não foi possível validar o PIN.'), 'error');
            self.render();
          })
          .validarPinPGO5(pin);
      }
    });
  },

  /**
   * Campo de PIN.
   *
   * type="password" para não ficar visível na tela, inputmode="numeric" para
   * o teclado do celular abrir em números, e autocomplete desligado para o
   * navegador não guardar o valor.
   */
  _campoPin: function(id, rotulo, digitos) {
    return '<div class="form-group"><label class="form-label" for="' + id + '">' +
      App.escapeHtml(rotulo) + ' <span class="required">*</span></label>' +
      '<input class="form-control pgo5seg-pin-campo" id="' + id + '" type="password" ' +
      'inputmode="numeric" autocomplete="off" maxlength="' + digitos + '" ' +
      'placeholder="' + new Array(digitos + 1).join('•') + '"></div>';
  },

  /**
   * Busca e mostra um link protegido.
   *
   * A URL só existe na página depois desta resposta, e apenas dentro do
   * modal. Se o servidor pedir PIN, abre o modal de PIN e tenta de novo.
   *
   * @param {string} recurso 'BANCO_PGO' ou 'FONTE_SAC'.
   */
  _abrirLinkProtegido: function(recurso) {
    var self = this;
    Components.showLoading('Verificando autorização...');

    google.script.run
      .withSuccessHandler(function(dados) {
        Components.hideLoading();
        Components.modal({
          title: dados.nome || 'Link protegido',
          body: '<p class="pgo5cfg-ajuda">Este endereço foi liberado agora e não fica ' +
            'guardado na tela.</p>' +
            '<p><a href="' + App.escapeHtml(dados.url) + '" target="_blank" rel="noopener">' +
            App.escapeHtml(dados.url) + '</a></p>',
          confirmText: 'Fechar',
          cancelText: ''
        });
      })
      .withFailureHandler(function(err) {
        Components.hideLoading();
        var mensagem = (err && err.message) || '';
        if (mensagem.indexOf('PIN_NECESSARIO') !== -1) {
          self._pedirPin(function() { self._abrirLinkProtegido(recurso); },
            'Este link é protegido pelo PIN administrativo.');
          return;
        }
        if (mensagem.indexOf('PIN_NAO_DEFINIDO') !== -1) {
          Components.toast('Defina o PIN administrativo antes de usar os links protegidos.',
            'warning', 6000);
          return;
        }
        Components.toast(mensagem || 'Não foi possível obter o link.', 'error');
      })
      .obterLinkProtegidoPGO5(recurso);
  },

  /** Modal da recuperação do administrador único. */
  _abrirRecuperacao: function() {
    var self = this;
    Components.modal({
      title: 'Recuperar meu acesso',
      body: '<p class="pgo5cfg-ajuda">Confirme o seu e-mail cadastrado. O sistema também ' +
        'confere a conta Google conectada agora — as duas precisam ser a mesma pessoa. ' +
        'Isto remove o bloqueio; o PIN continua o mesmo e não é mostrado.</p>' +
        '<div class="form-group"><label class="form-label" for="pgo5seg-email">' +
        'E-mail cadastrado <span class="required">*</span></label>' +
        '<input class="form-control" id="pgo5seg-email" type="email" autocomplete="off"></div>',
      confirmText: 'Recuperar',
      cancelText: 'Cancelar',
      onConfirm: function() {
        var campo = document.getElementById('pgo5seg-email');
        var email = campo ? campo.value.trim() : '';
        if (!email) {
          Components.toast('Informe o e-mail cadastrado.', 'warning');
          return false;
        }
        self._chamar('recuperarAcessoUnicoAdministradorPGO5', [email], 'Bloqueio removido.');
      }
    });
  },

  /** Carrega e mostra os registros de auditoria. */
  _carregarAuditoria: function() {
    var self = this;
    var destino = document.getElementById('pgo5seg-auditoria-lista');
    if (!destino) return;
    destino.innerHTML = '<p class="pgo5cfg-ajuda">Carregando...</p>';

    google.script.run
      .withSuccessHandler(function(dados) {
        var registros = (dados && dados.registros) || [];
        if (!registros.length) {
          destino.innerHTML = Components.emptyState('history', 'Nenhuma ação registrada ainda.');
          return;
        }
        var html = '<div class="pgo5cfg-scroll"><table class="pgo5cfg-tabela"><thead><tr>' +
          '<th>Quando</th><th>Ação</th><th>Onde</th><th>Resumo</th><th>Quem</th>' +
          '</tr></thead><tbody>';
        registros.forEach(function(registro) {
          html += '<tr>' +
            '<td>' + App.escapeHtml(self._dataHora(registro.data)) + '</td>' +
            '<td><span class="badge badge-neutral">' + App.escapeHtml(registro.acao) + '</span></td>' +
            '<td>' + App.escapeHtml(registro.entidade) + '</td>' +
            '<td>' + App.escapeHtml(registro.resumo) + '</td>' +
            '<td>' + App.escapeHtml(registro.executor) + '</td></tr>';
        });
        destino.innerHTML = html + '</tbody></table></div>';
      })
      .withFailureHandler(function(err) {
        destino.innerHTML = Components.emptyState('lock',
          'Não foi possível carregar a auditoria.', App.escapeHtml((err && err.message) || ''));
      })
      .listarAuditoriaPGO5(200);
  },

  /** Hora no formato HH:MM, para o aviso da liberação. */
  _hora: function(iso) {
    var data = new Date(iso);
    if (isNaN(data.getTime())) return '';
    return ('0' + data.getHours()).slice(-2) + ':' + ('0' + data.getMinutes()).slice(-2);
  },

  /** Data e hora em formato brasileiro. */
  _dataHora: function(iso) {
    var data = new Date(iso);
    if (isNaN(data.getTime())) return String(iso || '');
    return ('0' + data.getDate()).slice(-2) + '/' + ('0' + (data.getMonth() + 1)).slice(-2) +
      '/' + data.getFullYear() + ' ' + this._hora(iso);
  },

  /** Chama o backend e redesenha. O sucesso só é anunciado depois. */
  _chamar: function(funcao, args, mensagemOk) {
    var self = this;
    if (self.state.salvando) return;
    self.state.salvando = true;
    Components.showLoading('Processando...');

    var run = google.script.run
      .withSuccessHandler(function() {
        self.state.salvando = false;
        Components.hideLoading();
        Components.toast(mensagemOk, 'success');
        self.render();
      })
      .withFailureHandler(function(err) {
        self.state.salvando = false;
        Components.hideLoading();
        Components.toast(((err && err.message) || 'Não foi possível concluir a operação.'), 'error');
      });
    run[funcao].apply(run, args);
  }
};
</script>
