<script>
/* ============================================================
   PRISMA Gestão Operacional — PGO 5.0
   Arquivo: ImportacaoPGO5.html

   RESPONSABILIDADE
   Tela "Importar Base Legada": traz o histórico de uma planilha do
   sistema antigo (4.x) para dentro do banco PGO 5.0 em produção.

   ⚠️ ISTO NÃO É TOMBAMENTO
   Tombamento cria um banco novo e roda uma vez. Esta importação
   ACRESCENTA registros ao banco que já está rodando, e pode ser
   repetida: cada linha importada leva uma etiqueta, e reimportar a
   mesma planilha reconhece o que já entrou em vez de duplicar.

   Nada é apagado, limpo ou sobrescrito — ver Pgo5Importacao.gs.
   ============================================================ */

Pages.importacaoPGO5 = {
  state: { origens: [], executando: false, resultado: null },

  /**
   * Devolve o elemento onde esta tela deve desenhar.
   *
   * Mesmo padrão das outras telas de Configurações: quando existe o slot
   * "pgo5cfg-externo", desenha lá dentro e o menu de Configurações continua
   * visível ao lado; senão ocupa o <main> inteiro.
   * @returns {HTMLElement} Elemento alvo.
   */
  _alvo: function() {
    return document.getElementById('pgo5cfg-externo') || document.getElementById('app');
  },

  /** true quando está embutida na tela de Configurações. */
  _embutido: function() { return !!document.getElementById('pgo5cfg-externo'); },

  /**
   * Abre a tela.
   * @param {HTMLElement} [container] Elemento onde desenhar.
   */
  render: function(container) {
    var self = this;
    // Conforto: o servidor revalida a permissão E o PIN a cada chamada.
    if (!AcessoPGO5.podeNaInterface('configurarSistema')) {
      App.navigateTo('dashboard');
      return;
    }
    self.state.resultado = null;
    self.state.executando = false;
    self._pintar();

    google.script.run
      .withSuccessHandler(function(dados) {
        self.state.origens = (dados && dados.origens) || [];
        self._pintar();
      })
      .withFailureHandler(function(err) {
        Components.toast(((err && err.message) || 'Não foi possível carregar as origens.'), 'error');
      })
      .listarOrigensLegadasPGO5();
  },

  /** Desenha a tela inteira. */
  _pintar: function() {
    var self = this;
    var alvo = self._alvo();
    if (!alvo) return;
    var s = self.state;

    var html = '';
    if (!self._embutido()) {
      html += '<div class="page-header pgo5-header-compacto"><h1 class="page-title">Importar Base Legada</h1></div>';
    }

    html += '<div class="card">';
    html += '<h2 class="pgo5-escolha-titulo">Importar do sistema antigo</h2>';
    html += '<p class="pgo5-escolha-ajuda">' +
      'Traz o histórico de atendimentos de uma planilha do sistema antigo para dentro do PGO. ' +
      'Cada linha é conferida antes de entrar, e o que não passa é informado no resumo. ' +
      'Registros já importados são reconhecidos: <strong>pode importar de novo sem duplicar</strong>.' +
      '</p>';

    html += '<div class="pgo5-grid" style="margin-top:14px;">';
    html += '  <div class="form-group" data-campo="origem">' +
      '<label class="form-label" for="imp-aba">Aba de origem <span class="required">*</span></label>' +
      '<select class="form-control" id="imp-aba">';
    if (!s.origens.length) {
      html += '<option value="">Carregando...</option>';
    } else {
      s.origens.forEach(function(o) {
        html += '<option value="' + App.escapeHtml(o.aba) + '">' +
          App.escapeHtml(o.aba) + ' &rarr; ' + App.escapeHtml(o.canal) + '</option>';
      });
    }
    html += '</select></div>';

    html += '  <div class="form-group" data-campo="observacoes">' +
      '<label class="form-label" for="imp-url">Link da planilha antiga <span class="required">*</span></label>' +
      '<input class="form-control" type="text" id="imp-url" ' +
      'placeholder="https://docs.google.com/spreadsheets/d/..."></div>';
    html += '</div>';

    html += '<div class="form-actions pgo5-acoes">';
    html += '<button type="button" class="btn btn-primary" id="imp-executar"' +
      (s.executando ? ' disabled' : '') + '>' +
      (s.executando ? 'Importando...' : '⬇ Importar agora') + '</button>';
    if (self._embutido()) {
      html += '<span class="pgo5-dica-teclado">Nada é apagado: a importação apenas acrescenta.</span>';
    }
    html += '</div>';

    if (s.resultado) html += self._resumoHtml(s.resultado);

    html += '<p class="pgo5-escolha-ajuda" style="margin-top:14px;">' +
      'A planilha antiga é aberta <strong>somente para leitura</strong> — nada é escrito nela. ' +
      'Produtos, categorias e status que existirem só no sistema antigo são criados aqui, ' +
      'para o histórico importado não aparecer como “Sem dados”.</p>';
    html += '</div>';

    alvo.innerHTML = html;
    self._ligarEventos();
  },

  /**
   * Resumo do que aconteceu, no mesmo formato do Prisma Performance:
   * quantos entraram, quantos já existiam e o motivo de cada exclusão.
   * @param {Object} r Resposta de importarBaseLegadaPGO5.
   * @returns {string} HTML do resumo.
   */
  _resumoHtml: function(r) {
    var html = '<div class="pgo5-historicos" style="margin-top:18px;">';
    html += '<h3>Resultado da importação</h3>';
    html += '<p><strong>' + App.formatNumber(r.importados || 0) + '</strong> registro(s) importado(s) de ' +
      App.formatNumber(r.total || 0) + ' linha(s) lidas — canal <strong>' +
      App.escapeHtml(r.canal || '') + '</strong>.</p>';

    if (r.jaImportados) {
      html += '<p class="pgo5-escolha-ajuda">' + App.formatNumber(r.jaImportados) +
        ' já estava(m) no sistema e foram pulados, sem duplicar.</p>';
    }

    var motivos = Object.keys(r.motivos || {});
    if (motivos.length) {
      html += '<p style="margin-top:8px;">Pulados na conferência:</p><ul>';
      motivos.forEach(function(m) {
        html += '<li>' + App.escapeHtml(m) + ': <strong>' + r.motivos[m] + '</strong></li>';
      });
      html += '</ul>';
    }

    if ((r.criadosNoCatalogo || []).length) {
      html += '<p style="margin-top:8px;">Itens criados no catálogo (existiam só no sistema antigo):</p><ul>';
      r.criadosNoCatalogo.slice(0, 20).forEach(function(item) {
        html += '<li>' + App.escapeHtml(item) + '</li>';
      });
      if (r.criadosNoCatalogo.length > 20) {
        html += '<li>… e mais ' + (r.criadosNoCatalogo.length - 20) + '.</li>';
      }
      html += '</ul>';
    }
    html += '</div>';
    return html;
  },

  /** Liga os eventos da tela. */
  _ligarEventos: function() {
    var self = this;
    var botao = document.getElementById('imp-executar');
    if (botao) botao.addEventListener('click', function() { self._executar(); });
  },

  /** Dispara a importação, com trava contra duplo clique. */
  _executar: function() {
    var self = this;
    if (self.state.executando) return;

    var aba = (document.getElementById('imp-aba') || {}).value || '';
    var url = ((document.getElementById('imp-url') || {}).value || '').trim();
    if (!aba) { Components.toast('Escolha a aba de origem.', 'error'); return; }
    if (!url) { Components.toast('Cole o link da planilha antiga.', 'error'); return; }

    // Trava ANTES de chamar: importar duas vezes ao mesmo tempo não duplicaria
    // (a etiqueta protege), mas gastaria o dobro do tempo e confundiria o resumo.
    self.state.executando = true;
    self.state.resultado = null;
    self._pintar();

    google.script.run
      .withSuccessHandler(function(r) {
        self.state.executando = false;
        self.state.resultado = r || {};
        // O catálogo pode ter ganhado itens novos: descartar o que está em
        // memória faz a próxima abertura do formulário já vir atualizada.
        App.invalidarFormularioPGO5();
        self._pintar();
        Components.toast('Importação concluída. ' + (r && r.importados ? r.importados : 0) +
          ' registro(s) adicionado(s). ✓', 'success');
      })
      .withFailureHandler(function(err) {
        self.state.executando = false;
        self._pintar();
        Components.toast(((err && err.message) || 'Não foi possível importar.'), 'error');
      })
      .importarBaseLegadaPGO5({ url: url, aba: aba });
  }
};
</script>
