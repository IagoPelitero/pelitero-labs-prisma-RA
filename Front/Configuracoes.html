<script>
/* ============================================================
   PRISMA Gestão Operacional (Pelitero Labs) — Configuracoes.html
   Pages.configuracoes — Administração da operação (Supervisor/ADM)
   Desenvolvido por Pelitero Labs.
   ------------------------------------------------------------
   GUIA PARA QUEM ESTÁ COMEÇANDO
   Esta tela mostra as "listas cadastráveis" do sistema: Produtos,
   Categorias, Canais (só ADM), Usuários (só ADM) e Campos do formulário
   (só ADM). Status ("Pendente"/"Em análise"/"Concluído") e "Aguardando
   Retorno de" (Área/Cliente) são regras fixas do fluxo, definidas em
   Config.gs, e por isso não aparecem aqui.
   v4.2: os CANAIS deixaram de ser fixos — o ADM adiciona, edita e exclui
   canais por aqui; o formulário de Novo Atendimento, o Dashboard, os
   Indicadores e os filtros refletem automaticamente cada alteração.
   v4.2: excluir uma CATEGORIA ou um CANAL agora remove DEFINITIVAMENTE a
   linha da aba correspondente do Google Sheets (após confirmação).
   v4.3: nova seção "Banco de Dados" (só ADM) exibe o link da planilha
   Google Sheets do sistema para manutenção manual quando necessária.

   "metadata" (logo abaixo) descreve, para cada tipo de cadastro, quais
   campos existem no formulário (nome, tipo de campo, se é obrigatório).
   Isso permite que o mesmo código desenhe formulários diferentes para
   Produtos, Categorias e Usuários, sem repetir HTML para cada um.
   "active" guarda qual aba/lista está sendo exibida no momento.

   Para adicionar um NOVO tipo de cadastro nesta tela, o caminho é:
   1) adicionar a nova aba em CONFIG.SHEET_NAMES e COLUMNS (Config.gs),
   2) criar uma entrada nova dentro de "metadata" aqui,
   3) incluir a aba em getConfigurationEntities_() (Services.gs).
   ============================================================ */
Pages.configuracoes = {
  data: {},
  active: 'produtos',
  metadata: {
    produtos: {
      label: 'Produtos', icon: 'inventory_2',
      fields: [
        { key: 'Nome', label: 'Nome', required: true },
        { key: 'Descricao', label: 'Descrição', type: 'textarea' },
        { key: 'Ativo', label: 'Ativo', type: 'checkbox', defaultValue: true },
        { key: 'Ordem', label: 'Ordem', type: 'number' }
      ]
    },
    categorias: {
      label: 'Categorias', icon: 'category',
      // v4.2: exclusão definitiva (a linha é removida da aba Categorias).
      permanentDelete: true,
      fields: [
        { key: 'ProdutoId', label: 'Produto', type: 'reference', source: 'produtos', allowBlank: true },
        { key: 'Nome', label: 'Nome', required: true },
        { key: 'Descricao', label: 'Descrição', type: 'textarea' },
        { key: 'Ativo', label: 'Ativo', type: 'checkbox', defaultValue: true },
        { key: 'Ordem', label: 'Ordem', type: 'number' }
      ]
    },
    // v4.6: subcategorias — terceiro nível da classificação
    // (Produto → Categoria → Subcategoria). Administráveis por Supervisor
    // e ADM; a cascata do formulário de Novo Atendimento, o Dashboard e os
    // filtros refletem qualquer alteração automaticamente (reloadBootstrap).
    subcategorias: {
      label: 'Subcategorias', icon: 'account_tree',
      descricao: 'Terceiro nível da classificação: Produto → Categoria → Subcategoria. ' +
        'Vincule cada subcategoria a uma categoria; o formulário de Novo Atendimento ' +
        'carrega as opções em cascata conforme o produto e a categoria escolhidos.',
      permanentDelete: true,
      fields: [
        { key: 'CategoriaId', label: 'Categoria', type: 'reference', source: 'categorias', required: true },
        { key: 'Nome', label: 'Nome', required: true },
        { key: 'Ativo', label: 'Ativo', type: 'checkbox', defaultValue: true },
        { key: 'Ordem', label: 'Ordem', type: 'number' }
      ]
    },
    // v4.2: canais de entrada administráveis pelo ADM. Toda alteração é
    // refletida automaticamente no formulário de Novo Atendimento, no
    // Dashboard, nos Indicadores e nos filtros (via App.reloadBootstrap).
    canais: {
      label: 'Canais', icon: 'hub', adminOnly: true,
      permanentDelete: true,
      fields: [
        { key: 'Nome', label: 'Nome', required: true },
        { key: 'Ativo', label: 'Ativo', type: 'checkbox', defaultValue: true },
        { key: 'Ordem', label: 'Ordem', type: 'number' }
      ]
    },
    usuarios: {
      label: 'Usuários e responsáveis', icon: 'group', adminOnly: true,
      fields: [
        { key: 'Nome', label: 'Nome', required: true },
        // v4.5: o e-mail é a ÚNICA credencial de acesso — sem login/senha,
        // o sistema autentica quem acessa cruzando a conta Google com este
        // campo (requireAuth_ em Services.gs). Por isso é obrigatório.
        { key: 'Email', label: 'E-mail', type: 'email', required: true },
        { key: 'Perfil', label: 'Perfil', type: 'select', options: ['Analista', 'Supervisor', 'ADM'], required: true },
        { key: 'Equipe', label: 'Equipe' },
        { key: 'Ativo', label: 'Ativo', type: 'checkbox', defaultValue: true }
      ]
    },
    // v4.6: central de Seletores Dinâmicos. Além de administrar os campos
    // do formulário, o ADM cria aqui novos campos de SELEÇÃO (tipo
    // "select") com opções próprias (separadas por ";") — sem alterar
    // código. Os seletores relacionais (Produto, Categoria, Subcategoria,
    // Canal) são administrados nas seções próprias; Status e "Aguardando
    // Retorno de" são fixos do fluxo (a resolução do atendimento depende
    // da semântica deles).
    camposFormulario: {
      label: 'Campos e Seletores', icon: 'dynamic_form', adminOnly: true,
      descricao: 'Central de seletores dinâmicos: crie, edite, ative/desative e remova ' +
        'campos do formulário — inclusive novos campos de seleção (tipo "select") com ' +
        'opções próprias, separadas por ponto e vírgula (;), sem alterar o código. ' +
        'Produto, Categoria, Subcategoria e Canal são administrados nas seções ao lado; ' +
        'Status e "Aguardando Retorno de" são regras fixas do fluxo.',
      fields: [
        { key: 'Rotulo', label: 'Rótulo', required: true },
        { key: 'Tipo', label: 'Tipo', type: 'select', options: ['text', 'date', 'textarea', 'number', 'select'] },
        { key: 'Opcoes', label: 'Opções do seletor (separadas por ;)', type: 'textarea',
          placeholder: 'Ex.: Alta; Média; Baixa — usado apenas no tipo "select"' },
        { key: 'Exibir', label: 'Exibir no formulário', type: 'checkbox', defaultValue: true, trueLabel: 'Exibido', falseLabel: 'Oculto' },
        { key: 'Obrigatorio', label: 'Obrigatório', type: 'checkbox', defaultValue: false, trueLabel: 'Obrigatório', falseLabel: 'Opcional' },
        { key: 'Ordem', label: 'Ordem', type: 'number' }
      ]
    },
    // v4.7: configuração da fonte de dados do módulo Indicadores
    // Operacionais (EXCLUSIVA do ADM). Não é uma lista cadastrável — é um
    // formulário único (custom) que define a planilha externa e as colunas.
    indicadoresOperacionais: {
      label: 'Análise de SAC', icon: 'query_stats', adminOnly: true,
      custom: true, customPanel: 'indicOp', fields: []
    },
    // Nomes VISÍVEIS das telas (EXCLUSIVO do ADM). Formulário único, não é
    // lista cadastrável. Altera só o rótulo — data-page, rotas e funções
    // continuam com os nomes técnicos originais.
    nomesTelas: {
      label: 'Nomes das telas', icon: 'label', adminOnly: true,
      custom: true, customPanel: 'nomesTelas', fields: []
    },
    // Seção "Banco de Dados" (EXCLUSIVA do ADM): não é uma lista
    // cadastrável — exibe o link da planilha Google Sheets usada como
    // base do sistema, para o administrador abrir/editar manualmente
    // quando necessário. O servidor revalida o perfil (getDatabaseInfo
    // usa requireAdmin_); Analistas e Supervisores não veem esta seção.
    bancoDados: {
      label: 'Banco de Dados', icon: 'storage', adminOnly: true,
      custom: true, fields: []
    }
  },

  // Informações da planilha (nome + URL), carregadas sob demanda na
  // primeira abertura da seção Banco de Dados e reutilizadas depois
  // (evita chamadas repetidas ao servidor).
  _dbInfo: null,

  // Entidades visíveis para o usuário logado: gestão de usuários e dos
  // campos do formulário são exclusivas do ADM.
  visibleEntities: function() {
    var self = this;
    return Object.keys(this.metadata).filter(function(key) {
      return !self.metadata[key].adminOnly || App.isAdmin();
    });
  },

  render: function(container) {
    container = container || document.getElementById('app');
    container.innerHTML =
      '<div class="page-header"><div><h1 class="page-title">Configurações</h1>' +
      '<p class="page-subtitle">Administração operacional sem alteração de código.</p></div></div>' +
      '<div class="card">' + Components.emptyState('settings', 'Carregando configurações...') + '</div>';
    this.load();
  },

  load: function() {
    var self = this;
    google.script.run
      .withSuccessHandler(function(result) {
        self.data = result && result.entities ? result.entities : {};
        self.renderShell();
      })
      .withFailureHandler(function(error) {
        Components.toast('Não foi possível carregar as configurações: ' + error.message, 'error');
        App.navigateTo('dashboard');
      })
      .getConfiguracoes();
  },

  renderShell: function() {
    var container = document.getElementById('app');
    var self = this;
    var visible = this.visibleEntities();
    if (visible.indexOf(this.active) === -1) this.active = visible[0] || 'produtos';
    // Seções "custom" (ex.: Banco de Dados) não são listas cadastráveis:
    // o botão "+ Novo registro" não se aplica e fica oculto.
    var isCustom = !!(this.metadata[this.active] || {}).custom;
    var html = '<div class="page-header"><div><h1 class="page-title">Configurações</h1>' +
      '<p class="page-subtitle">Produtos, categorias e acessos da operação.</p></div>' +
      (isCustom ? '' : '<button class="btn btn-primary" onclick="Pages.configuracoes.openForm()">+ Novo registro</button>') +
      '</div>';
    html += '<div class="config-layout"><aside class="config-nav">';
    visible.forEach(function(key) {
      var meta = self.metadata[key];
      // Seções custom não têm contador de registros.
      var count = meta.custom ? '' : '<span class="config-count">' + ((self.data[key] || []).length) + '</span>';
      html += '<button class="config-nav-item' + (self.active === key ? ' active' : '') +
        '" onclick="Pages.configuracoes.switchEntity(\'' + key + '\')">' +
        '<span class="material-icons">' + meta.icon + '</span><span>' + meta.label + '</span>' +
        count + '</button>';
    });
    html += '</aside><section class="card config-content"><div id="config-table"></div></section></div>';
    container.innerHTML = html;
    this.renderTable();
  },

  switchEntity: function(entity) {
    this.active = entity;
    this.renderShell();
  },

  renderTable: function() {
    var container = document.getElementById('config-table');
    var meta = this.metadata[this.active];
    // Seções custom têm renderização própria (não são tabelas de registros).
    if (meta.custom) {
      // v4.7: roteia pelo tipo de painel custom (padrão: Banco de Dados).
      if (meta.customPanel === 'indicOp') this.renderIndicOpPanel(container);
      else if (meta.customPanel === 'nomesTelas') this.renderNomesTelasPanel(container);
      else this.renderDatabasePanel(container);
      return;
    }
    var rows = this.data[this.active] || [];
    var html = '<div class="card-header"><div class="card-title"><span class="material-icons">' +
      meta.icon + '</span>' + meta.label + '</div><span class="badge">' + rows.length + ' registro(s)</span></div>';

    // v4.6: seções podem ter um texto explicativo (ex.: Subcategorias e a
    // central de Seletores Dinâmicos) para orientar o administrador.
    if (meta.descricao) {
      html += '<p style="font-size:13px;color:var(--text-secondary);margin:0 0 14px;">' +
        meta.descricao + '</p>';
    }

    if (!rows.length) {
      html += Components.emptyState('inbox', 'Nenhum registro cadastrado.');
      container.innerHTML = html;
      return;
    }

    html += '<div class="table-container"><table class="data-table"><thead><tr>';
    meta.fields.forEach(function(field) {
      html += '<th>' + field.label + '</th>';
    });
    html += '<th style="width:110px">Ações</th></tr></thead><tbody>';
    var self = this;
    rows.forEach(function(row, index) {
      html += '<tr>';
      meta.fields.forEach(function(field) {
        html += '<td>' + self.formatCell(row[field.key], field) + '</td>';
      });
      // v4.2: entidades com exclusão definitiva mostram o título "Excluir".
      var tituloRemover = meta.permanentDelete ? 'Excluir' : 'Desativar';
      html += '<td class="actions">' +
        '<button class="btn-action" title="Editar" onclick="Pages.configuracoes.openForm(' + index + ')">✏️</button>' +
        '<button class="btn-action" title="' + tituloRemover + '" onclick="Pages.configuracoes.remove(' + index + ')">🗑️</button>' +
        '</td></tr>';
    });
    html += '</tbody></table></div>';
    container.innerHTML = html;
  },

  /**
   * Painel "Banco de Dados" (exclusivo do ADM): mostra o nome e o link da
   * planilha Google Sheets do sistema, com botão para abri-la em nova
   * aba. As informações vêm de getDatabaseInfo (Services.gs), que
   * revalida o perfil ADM no servidor, e são cacheadas em _dbInfo para
   * não repetir a chamada a cada troca de seção.
   * @param {HTMLElement} container - <div id="config-table">.
   */
  renderDatabasePanel: function(container) {
    var self = this;

    var desenhar = function(info) {
      var html = '<div class="card-header"><div class="card-title">' +
        '<span class="material-icons">storage</span>Banco de Dados</div></div>';
      html += '<p style="font-size:13.5px;color:var(--text-secondary);margin-bottom:16px;">' +
        'Planilha Google Sheets utilizada como base de dados do sistema. ' +
        'Use o link abaixo para abri-la e editá-la manualmente quando necessário. ' +
        'Seção visível apenas para o perfil ADM.</p>';
      html += '<div style="display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;align-items:center;">';
      html += '<strong>Planilha:</strong><span>' + App.escapeHtml(info.nome || '—') + '</span>';
      html += '<strong>Link:</strong><span style="word-break:break-all;">' +
        '<a href="' + App.escapeHtml(info.url || '#') + '" target="_blank" rel="noopener">' +
        App.escapeHtml(info.url || '—') + '</a></span>';
      html += '</div>';
      html += '<div style="margin-top:18px;">' +
        '<a class="btn btn-primary" href="' + App.escapeHtml(info.url || '#') + '" target="_blank" rel="noopener">' +
        '<span class="material-icons">open_in_new</span> Abrir planilha</a></div>';
      container.innerHTML = html;
    };

    // Reutiliza a resposta anterior (menos idas ao servidor).
    if (self._dbInfo) {
      desenhar(self._dbInfo);
      return;
    }

    container.innerHTML = Components.emptyState('storage', 'Carregando informações da base de dados...');
    google.script.run
      .withSuccessHandler(function(info) {
        self._dbInfo = info || {};
        desenhar(self._dbInfo);
      })
      .withFailureHandler(function(error) {
        container.innerHTML = Components.emptyState('error_outline',
          'Não foi possível carregar as informações da base.', error.message);
      })
      .getDatabaseInfo();
  },

  /**
   * v4.7 — Painel de configuração do módulo Indicadores Operacionais
   * (EXCLUSIVO do ADM). Formulário único (não é lista) para definir a
   * planilha externa de origem e como lê-la. Ao salvar, recarrega o
   * bootstrap para o rótulo do menu refletir o novo nome imediatamente.
   * @param {HTMLElement} container - <div id="config-table">.
   */
  renderIndicOpPanel: function(container) {
    var self = this;
    container.innerHTML = Components.emptyState('query_stats', 'Carregando configuração...');

    google.script.run
      .withSuccessHandler(function(cfg) {
        self._indicOpCfg = cfg || {};
        // Cabeçalhos/status descobertos na origem. Enquanto o ADM não
        // clicar em "Ler planilha", o mapeamento fica em campos de texto —
        // assim uma configuração antiga continua editável mesmo que a
        // planilha externa esteja momentaneamente inacessível.
        self._indicOpFonte = null;
        self._renderIndicOpForm(container);
      })
      .withFailureHandler(function(error) {
        container.innerHTML = Components.emptyState('error_outline',
          'Não foi possível carregar a configuração.', error.message);
      })
      .getIndicadoresOperacionaisConfig();
  },

  /**
   * Painel "Nomes das telas" (EXCLUSIVO do ADM). Permite trocar o RÓTULO
   * visível de cada tela. Campo vazio volta ao nome padrão.
   *
   * Só apresentação: o identificador técnico da página (data-page) aparece
   * na tela apenas como informação e NUNCA muda — rotas, funções, abas,
   * colunas e integrações seguem intactas.
   * @param {HTMLElement} container - <div id="config-table">.
   */
  renderNomesTelasPanel: function(container) {
    var self = this;
    container.innerHTML = Components.emptyState('label', 'Carregando nomes...');

    google.script.run
      .withSuccessHandler(function(telas) {
        self._nomesTelas = telas || [];
        var html = '<div class="card-header"><div class="card-title">' +
          '<span class="material-icons">label</span>Nomes das telas</div></div>';
        html += '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">' +
          'Defina como cada tela aparece no menu e no seu título. É apenas o nome exibido — ' +
          'as páginas, permissões e dados do sistema não mudam. ' +
          '<strong>Deixe em branco para voltar ao nome padrão.</strong></p>';

        html += '<div class="config-form-grid">';
        self._nomesTelas.forEach(function(t) {
          var valor = t.personalizado ? t.nome : '';
          html += '<div class="form-group">';
          html += '<label class="form-label" for="tela-' + t.pagina + '">' + App.escapeHtml(t.padrao) + '</label>';
          html += '<input class="form-control" id="tela-' + t.pagina + '" type="text" maxlength="40" value="' +
            App.escapeHtml(valor) + '" placeholder="' + App.escapeHtml(t.padrao) + '">';
          html += '<small style="color:var(--text-secondary);font-size:11.5px;">Padrão: ' +
            App.escapeHtml(t.padrao) + '</small>';
          html += '</div>';
        });
        html += '</div>';
        html += '<div class="form-actions" style="margin-top:16px;">' +
          '<button type="button" class="btn btn-primary" id="telas-salvar">💾 Salvar nomes</button>' +
          '<button type="button" class="btn btn-secondary" id="telas-restaurar">↩️ Restaurar padrões</button></div>';

        container.innerHTML = html;

        var btn = document.getElementById('telas-salvar');
        if (btn) btn.addEventListener('click', function() { self._salvarNomesTelas(); });
        var btnR = document.getElementById('telas-restaurar');
        if (btnR) btnR.addEventListener('click', function() {
          self._nomesTelas.forEach(function(t) {
            var el = document.getElementById('tela-' + t.pagina);
            if (el) el.value = '';
          });
          self._salvarNomesTelas();
        });
      })
      .withFailureHandler(function(error) {
        container.innerHTML = Components.emptyState('error_outline',
          'Não foi possível carregar os nomes das telas.', error.message);
      })
      .getNomesTelas();
  },

  /** Coleta e salva os nomes visíveis; recarrega o menu ao concluir. */
  _salvarNomesTelas: function() {
    var self = this;
    var payload = {};
    (self._nomesTelas || []).forEach(function(t) {
      var el = document.getElementById('tela-' + t.pagina);
      payload[t.pagina] = el ? el.value : '';
    });
    Components.showLoading('Salvando nomes...');
    google.script.run
      .withSuccessHandler(function() {
        Components.hideLoading();
        Components.toast('Nomes das telas atualizados.', 'success');
        // Recarrega o bootstrap para o menu refletir os novos rótulos.
        App.reloadBootstrap(function() {
          var container = document.getElementById('config-table');
          if (container && self.active === 'nomesTelas') self.renderNomesTelasPanel(container);
        });
      })
      .withFailureHandler(function(error) {
        Components.hideLoading();
        Components.toast('Erro ao salvar: ' + error.message, 'error');
      })
      .salvarNomesTelas(payload);
  },

  /**
   * Normaliza uma lista da configuração para ARRAY.
   * O formulário tem duas variações: campos de texto separados por ";"
   * (antes de ler a planilha) e caixas/seletores (depois). A coleta devolve
   * texto numa e array na outra, então tudo que lê a configuração passa por
   * aqui — sem isso, alternar entre as variações quebra a tela.
   * @param {string|string[]} valor - Lista em qualquer um dos formatos.
   * @returns {string[]} Lista normalizada, sem vazios.
   */
  _listaCfgIndicOp: function(valor) {
    var bruta = Array.isArray(valor)
      ? valor
      : String(valor === undefined || valor === null ? '' : valor).split(';');
    return bruta.map(function(v) { return String(v).trim(); })
      .filter(function(v) { return v !== ''; });
  },

  /** Desenha o formulário de configuração da Análise de SAC. */
  _renderIndicOpForm: function(container) {
    var self = this;
    var cfg = self._indicOpCfg || {};
    var fonte = self._indicOpFonte;

    var html = '<div class="card-header"><div class="card-title">' +
      '<span class="material-icons">query_stats</span>Análise de SAC</div></div>';
    html += '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">' +
      'Configure a planilha Google Sheets externa que alimenta esta análise. As colunas são ' +
      'localizadas pelo NOME do cabeçalho — mudanças de ordem ou colunas novas na origem não ' +
      'quebram a leitura. Você precisa ter acesso à planilha informada.</p>';

    // ── 1. Fonte ──
    html += '<h4 style="margin:0 0 10px;">1. Fonte de dados</h4>';
    var basicos = [
      { k: 'abaNome', label: 'Nome da seção (menu)', tipo: 'text', dica: 'Como o item aparece no menu lateral e no título da tela.' },
      { k: 'planilhaUrl', label: 'Link da planilha de origem', tipo: 'text', dica: 'URL completa do Google Sheets externo.', wide: true },
      { k: 'abaOrigem', label: 'Nome da aba de origem', tipo: 'text', dica: 'Aba, dentro da planilha externa, com os dados.' },
      { k: 'linhaInicial', label: 'Linha do cabeçalho', tipo: 'number', dica: 'Linha onde estão os títulos das colunas (a tabela pode começar em qualquer linha).' }
    ];
    html += '<div class="config-form-grid">';
    basicos.forEach(function(c) {
      var valor = cfg[c.k] === undefined || cfg[c.k] === null ? '' : String(cfg[c.k]);
      html += '<div class="form-group' + (c.wide ? ' config-form-wide' : '') + '">';
      html += '<label class="form-label" for="indop-' + c.k + '">' + c.label + '</label>';
      html += '<input class="form-control" id="indop-' + c.k + '" type="' + c.tipo + '"' +
        (c.tipo === 'number' ? ' min="1"' : '') + ' value="' + App.escapeHtml(valor) + '">';
      html += '<small style="color:var(--text-secondary);font-size:11.5px;">' + c.dica + '</small>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="form-actions" style="margin-top:12px;">' +
      '<button type="button" class="btn btn-secondary" id="indop-ler">🔎 Ler cabeçalhos da planilha</button>' +
      '<span id="indop-ler-info" style="font-size:12.5px;color:var(--text-secondary);margin-left:10px;"></span></div>';

    // ── 2. Mapeamento das colunas ──
    html += '<h4 style="margin:22px 0 10px;">2. Mapeamento das colunas</h4>';
    if (!fonte) {
      html += '<p style="font-size:12.5px;color:var(--text-secondary);margin-bottom:12px;">' +
        'Clique em <strong>Ler cabeçalhos da planilha</strong> para escolher as colunas em listas. ' +
        'Enquanto isso, informe os nomes exatos dos cabeçalhos.</p>';
    }
    var mapeaveis = [
      { k: 'colunaData', label: 'Data', obrig: true },
      { k: 'colunaStatus', label: 'Status', obrig: true },
      { k: 'colunaAssunto', label: 'Assunto', obrig: false },
      { k: 'colunaSubassunto', label: 'Subassunto', obrig: false },
      { k: 'colunaAnalista', label: 'Quem analisou', obrig: false }
    ];
    html += '<div class="config-form-grid">';
    mapeaveis.forEach(function(c) {
      var valor = cfg[c.k] === undefined || cfg[c.k] === null ? '' : String(cfg[c.k]);
      html += '<div class="form-group">';
      html += '<label class="form-label" for="indop-' + c.k + '">' + c.label +
        (c.obrig ? ' <span style="color:var(--danger,#E53935)">*</span>' : '') + '</label>';
      if (fonte && fonte.cabecalhos && fonte.cabecalhos.length) {
        html += '<select class="form-control" id="indop-' + c.k + '">';
        html += '<option value="">' + (c.obrig ? '— selecione —' : '— não usar —') + '</option>';
        fonte.cabecalhos.forEach(function(h) {
          html += '<option value="' + App.escapeHtml(h) + '"' +
            (String(h).toLowerCase() === valor.toLowerCase() ? ' selected' : '') + '>' +
            App.escapeHtml(h) + '</option>';
        });
        html += '</select>';
      } else {
        html += '<input class="form-control" id="indop-' + c.k + '" type="text" value="' +
          App.escapeHtml(valor) + '">';
      }
      html += '</div>';
    });
    html += '</div>';

    // Colunas categóricas extras liberadas para o seletor "Analisar por".
    html += '<div class="form-group" style="margin-top:12px;">';
    html += '<label class="form-label">Outras colunas para "Analisar por"</label>';
    var extras = self._listaCfgIndicOp(cfg.colunasExtras);
    if (fonte && fonte.cabecalhos && fonte.cabecalhos.length) {
      html += '<div style="display:flex;gap:14px;flex-wrap:wrap;padding:8px 0;">';
      fonte.cabecalhos.forEach(function(h, i) {
        var marcado = extras.some(function(e) { return String(e).toLowerCase() === String(h).toLowerCase(); });
        html += '<label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;">' +
          '<input type="checkbox" class="indop-extra" data-col="' + App.escapeHtml(h) + '"' +
          (marcado ? ' checked' : '') + '> ' + App.escapeHtml(h) + '</label>';
      });
      html += '</div>';
    } else {
      html += '<input class="form-control" id="indop-colunasExtras" type="text" value="' +
        App.escapeHtml(extras.join('; ')) + '" placeholder="Ex.: Canal; Fila; Prioridade">';
    }
    html += '<small style="color:var(--text-secondary);font-size:11.5px;">' +
      'Ficam disponíveis no seletor “Analisar por” da tela de análise.</small>';
    html += '</div>';

    // ── 3. Agrupamento de status ──
    html += '<h4 style="margin:22px 0 10px;">3. Agrupamento de Status</h4>';
    html += '<p style="font-size:12.5px;color:var(--text-secondary);margin-bottom:12px;">' +
      'Defina a que grupo pertence cada valor de status da planilha. ' +
      '<strong>Fechado</strong> e <strong>Rejeitado</strong> podem ficar no mesmo grupo. ' +
      'O que ficar sem grupo é contado como <strong>Não Classificado</strong> — nunca como “Em Aberto”.</p>';
    html += self._indicOpStatusHtml(cfg, fonte);

    html += '<div class="form-actions" style="margin-top:20px;">' +
      '<button type="button" class="btn btn-primary" id="indop-salvar">💾 Salvar configuração</button></div>';

    container.innerHTML = html;

    var btnLer = document.getElementById('indop-ler');
    if (btnLer) btnLer.addEventListener('click', function() { self._lerFonteIndicOp(container); });
    var btnSalvar = document.getElementById('indop-salvar');
    if (btnSalvar) btnSalvar.addEventListener('click', function() { self._salvarIndicOp(); });
  },

  /**
   * Bloco de agrupamento de status. Com a planilha lida, cada valor
   * encontrado vira uma linha com um seletor de grupo (o caminho fácil).
   * Sem leitura, cai para três campos de texto separados por ";" — permite
   * editar uma configuração existente sem depender da planilha.
   */
  _indicOpStatusHtml: function(cfg, fonte) {
    var grupos = [
      { k: 'statusEmAberto', label: 'Em Aberto' },
      { k: 'statusEmAnalise', label: 'Em Análise' },
      { k: 'statusFechado', label: 'Fechado' }
    ];
    var self = this;
    var atual = {};
    grupos.forEach(function(g) {
      self._listaCfgIndicOp(cfg[g.k]).forEach(function(v) { atual[String(v).toLowerCase()] = g.k; });
    });

    if (fonte && fonte.statusEncontrados && fonte.statusEncontrados.length) {
      var html = '<div class="indop-scroll"><table class="indop-table" style="min-width:420px;">';
      html += '<thead><tr><th class="indop-rowhead">Status na planilha</th><th>Grupo</th></tr></thead><tbody>';
      fonte.statusEncontrados.forEach(function(s, i) {
        var sel = atual[String(s).toLowerCase()] || '';
        html += '<tr><td class="indop-rowhead">' + App.escapeHtml(s) + '</td><td>';
        html += '<select class="form-control indop-status-map" data-status="' + App.escapeHtml(s) + '">';
        html += '<option value="">Não Classificado</option>';
        grupos.forEach(function(g) {
          html += '<option value="' + g.k + '"' + (sel === g.k ? ' selected' : '') + '>' + g.label + '</option>';
        });
        html += '</select></td></tr>';
      });
      html += '</tbody></table></div>';
      return html;
    }

    var htmlTexto = '<div class="config-form-grid">';
    grupos.forEach(function(g) {
      htmlTexto += '<div class="form-group">';
      htmlTexto += '<label class="form-label" for="indop-' + g.k + '">' + g.label + '</label>';
      htmlTexto += '<input class="form-control" id="indop-' + g.k + '" type="text" value="' +
        App.escapeHtml(self._listaCfgIndicOp(cfg[g.k]).join('; ')) + '" placeholder="Valores separados por ;">';
      htmlTexto += '</div>';
    });
    htmlTexto += '</div>';
    return htmlTexto;
  },

  /** Lê cabeçalhos e status distintos da planilha externa informada. */
  _lerFonteIndicOp: function(container) {
    var self = this;
    var info = document.getElementById('indop-ler-info');
    // Preserva o que já está digitado antes de redesenhar o formulário.
    self._indicOpCfg = Object.assign({}, self._indicOpCfg, self._coletarIndicOp());
    if (info) info.textContent = 'Lendo a planilha...';

    google.script.run
      .withSuccessHandler(function(fonte) {
        self._indicOpFonte = fonte || null;
        self._renderIndicOpForm(container);
        var msg = document.getElementById('indop-ler-info');
        if (msg && fonte) {
          msg.textContent = '✓ ' + (fonte.cabecalhos || []).length + ' colunas e ' +
            (fonte.statusEncontrados || []).length + ' status encontrados em ' +
            App.formatNumber(fonte.totalLinhas || 0) + ' linhas.';
        }
      })
      .withFailureHandler(function(error) {
        if (info) info.textContent = '';
        Components.toast(String(error.message || '').replace(/^INDICOP:\s*/, ''), 'error');
      })
      .getIndicadoresOperacionaisFonte({
        planilhaUrl: self._indicOpCfg.planilhaUrl,
        abaOrigem: self._indicOpCfg.abaOrigem,
        linhaInicial: self._indicOpCfg.linhaInicial,
        colunaStatus: self._indicOpCfg.colunaStatus
      });
  },

  /** Lê o formulário atual (funciona nas duas variações: lista ou texto). */
  _coletarIndicOp: function() {
    var val = function(id) {
      var el = document.getElementById(id);
      return el ? String(el.value || '') : '';
    };
    var payload = {
      abaNome: val('indop-abaNome'),
      planilhaUrl: val('indop-planilhaUrl'),
      abaOrigem: val('indop-abaOrigem'),
      linhaInicial: val('indop-linhaInicial') || '1',
      colunaData: val('indop-colunaData'),
      colunaStatus: val('indop-colunaStatus'),
      colunaAssunto: val('indop-colunaAssunto'),
      colunaSubassunto: val('indop-colunaSubassunto'),
      colunaAnalista: val('indop-colunaAnalista')
    };

    // Colunas extras: caixas de seleção (após ler a planilha) ou texto.
    var caixas = document.querySelectorAll('.indop-extra');
    if (caixas.length) {
      payload.colunasExtras = Array.prototype.filter.call(caixas, function(c) { return c.checked; })
        .map(function(c) { return c.getAttribute('data-col'); });
    } else {
      payload.colunasExtras = val('indop-colunasExtras');
    }

    // Agrupamento de status: seletores por valor ou três campos de texto.
    var seletores = document.querySelectorAll('.indop-status-map');
    if (seletores.length) {
      payload.statusEmAberto = [];
      payload.statusEmAnalise = [];
      payload.statusFechado = [];
      Array.prototype.forEach.call(seletores, function(s) {
        if (s.value && payload[s.value]) payload[s.value].push(s.getAttribute('data-status'));
      });
    } else {
      payload.statusEmAberto = val('indop-statusEmAberto');
      payload.statusEmAnalise = val('indop-statusEmAnalise');
      payload.statusFechado = val('indop-statusFechado');
    }
    return payload;
  },

  /** Coleta o formulário e salva a configuração do módulo. */
  _salvarIndicOp: function() {
    var self = this;
    var payload = self._coletarIndicOp();
    Components.showLoading('Salvando configuração...');
    google.script.run
      .withSuccessHandler(function(res) {
        Components.hideLoading();
        if (res && res.config) self._indicOpCfg = res.config;
        Components.toast('Configuração salva com sucesso.', 'success');
        // Atualiza o rótulo do menu (nome da seção pode ter mudado).
        App.reloadBootstrap();
      })
      .withFailureHandler(function(error) {
        Components.hideLoading();
        Components.toast('Erro ao salvar: ' + error.message, 'error');
      })
      .salvarIndicadoresOperacionaisConfig(payload);
  },

  formatCell: function(value, field) {
    if (field.type === 'checkbox') {
      return value === true || String(value).toLowerCase() === 'true'
        ? '<span class="badge badge-success">' + (field.trueLabel || 'Ativo') + '</span>'
        : '<span class="badge badge-neutral">' + (field.falseLabel || 'Inativo') + '</span>';
    }
    if (field.type === 'color') {
      return '<span class="color-preview" style="background:' + this.escape(value || '#999') + '"></span>' +
        this.escape(value || '');
    }
    if (field.type === 'reference') {
      return this.escape(this.referenceLabel(field.source, value) || 'Todos');
    }
    return this.escape(value === undefined || value === null || value === '' ? '—' : String(value));
  },

  referenceLabel: function(source, id) {
    if (!id) return '';
    var rows = this.data[source] || [];
    for (var i = 0; i < rows.length; i++) {
      if (String(rows[i].Id) === String(id)) {
        var rotulo = rows[i].Nome || rows[i].Id;
        // v4.6: na tabela de Subcategorias, a coluna Categoria exibe também
        // o produto ("Fatura (Cartão de Crédito)") — nomes de categoria
        // podem se repetir entre produtos.
        if (source === 'categorias' && rows[i].ProdutoId) {
          var produto = this.referenceLabel('produtos', rows[i].ProdutoId);
          if (produto) rotulo += ' (' + produto + ')';
        }
        return rotulo;
      }
    }
    return id;
  },

  openForm: function(index) {
    var meta = this.metadata[this.active];
    if (meta.custom) return; // seções custom não têm formulário de registro
    var record = typeof index === 'number' ? (this.data[this.active] || [])[index] : {};
    var body = '<div class="config-form-grid">';
    var self = this;
    meta.fields.forEach(function(field) {
      var value = record[field.key];
      if ((value === undefined || value === '') && field.defaultValue !== undefined) value = field.defaultValue;
      body += '<div class="form-group' + (field.type === 'textarea' ? ' config-form-wide' : '') + '">';
      if (field.type === 'checkbox') {
        body += '<label class="checkbox-label"><input type="checkbox" id="cfg-' + field.key + '"' +
          (value === true || String(value).toLowerCase() === 'true' ? ' checked' : '') + '> ' + field.label + '</label>';
      } else {
        body += '<label class="form-label" for="cfg-' + field.key + '">' + field.label +
          (field.required ? ' <span class="required">*</span>' : '') + '</label>';
        body += self.renderInput(field, value);
      }
      body += '</div>';
    });
    body += '</div>';

    Components.modal({
      title: (record.Id ? 'Editar ' : 'Novo registro — ') + meta.label,
      body: body,
      size: 'lg',
      confirmText: 'Salvar',
      cancelText: 'Cancelar',
      onConfirm: function() {
        self.save(record.Id || '');
      }
    });
  },

  renderInput: function(field, value) {
    var safeValue = this.escape(value === undefined || value === null ? '' : String(value));
    if (field.type === 'textarea') {
      return '<textarea class="form-control" id="cfg-' + field.key + '" rows="3"' +
        (field.placeholder ? ' placeholder="' + field.placeholder + '"' : '') + '>' + safeValue + '</textarea>';
    }
    if (field.type === 'select') {
      var html = '<select class="form-control" id="cfg-' + field.key + '">';
      (field.options || []).forEach(function(option) {
        html += '<option value="' + option + '"' + (String(value) === option ? ' selected' : '') + '>' + option + '</option>';
      });
      return html + '</select>';
    }
    if (field.type === 'reference') {
      var self = this;
      var ref = '<select class="form-control" id="cfg-' + field.key + '">';
      if (field.allowBlank) ref += '<option value="">Todos / não especificado</option>';
      var rows = this.data[field.source] || [];
      rows.forEach(function(item) {
        // v4.6: categorias podem repetir o nome entre produtos — o rótulo
        // inclui o produto para o vínculo ficar inequívoco no cadastro de
        // subcategorias (ex.: "Cobrança indevida (Cartão de Crédito)").
        var rotulo = item.Nome || item.Id;
        if (field.source === 'categorias' && item.ProdutoId) {
          var produto = self.referenceLabel('produtos', item.ProdutoId);
          if (produto) rotulo += ' (' + produto + ')';
        }
        ref += '<option value="' + item.Id + '"' + (String(value) === String(item.Id) ? ' selected' : '') +
          '>' + self.escape(rotulo) + '</option>';
      });
      return ref + '</select>';
    }
    var type = field.type || 'text';
    return '<input class="form-control" id="cfg-' + field.key + '" type="' + type + '" value="' + safeValue + '"' +
      (field.placeholder ? ' placeholder="' + field.placeholder + '"' : '') +
      (field.step ? ' step="' + field.step + '"' : '') + (field.required ? ' required' : '') + '>';
  },

  save: function(id) {
    var meta = this.metadata[this.active];
    var payload = {};
    var missing = [];
    meta.fields.forEach(function(field) {
      var element = document.getElementById('cfg-' + field.key);
      var value = field.type === 'checkbox' ? !!element.checked : element.value.trim();
      if (field.required && !value) missing.push(field.label);
      payload[field.key] = value;
    });
    if (missing.length) {
      Components.toast('Preencha: ' + missing.join(', '), 'warning');
      return;
    }

    var self = this;
    Components.showLoading('Salvando configuração...');
    google.script.run
      .withSuccessHandler(function() {
        Components.hideLoading();
        Components.toast('Configuração salva com sucesso.', 'success');
        App.reloadBootstrap();
        self.load();
      })
      .withFailureHandler(function(error) {
        Components.hideLoading();
        Components.toast('Erro ao salvar: ' + error.message, 'error');
      })
      .salvarConfiguracao(this.active, payload, id);
  },

  remove: function(index) {
    var row = (this.data[this.active] || [])[index];
    if (!row) return;
    var id = row.Id;
    var self = this;
    var meta = this.metadata[this.active];
    // v4.2: mensagem de confirmação específica para exclusões DEFINITIVAS
    // (categorias e canais): a linha é removida da aba do Google Sheets e
    // todas as listas suspensas, filtros e indicadores são atualizados.
    var mensagem = meta.permanentDelete
      ? 'Excluir DEFINITIVAMENTE "' + App.escapeHtml(row.Nome || id) + '"? ' +
        'O registro será removido da planilha do Google Sheets e esta ação não pode ser desfeita.'
      : 'Deseja desativar/remover este registro?';
    Components.confirm(mensagem, function() {
      Components.showLoading('Atualizando configuração...');
      google.script.run
        .withSuccessHandler(function() {
          Components.hideLoading();
          Components.toast('Registro atualizado com sucesso.', 'success');
          App.reloadBootstrap();
          self.load();
        })
        .withFailureHandler(function(error) {
          Components.hideLoading();
          Components.toast('Erro: ' + error.message, 'error');
        })
        .excluirConfiguracao(self.active, id);
    }, 'Confirmar alteração');
  },

  // Delegado para o helper global (DRY): a lógica de escape de HTML vive
  // em um único lugar, App.escapeHtml (Scripts.html).
  escape: function(value) {
    return App.escapeHtml(value);
  }
};
</script>
