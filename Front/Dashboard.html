<script>
/* ============================================================
   PRISMA Gestão Operacional (Pelitero Labs) — Dashboard.html
   Pages.dashboard — Tela inicial (visão geral + lista de atendimentos)
   Desenvolvido por Pelitero Labs.
   ------------------------------------------------------------
   GUIA PARA QUEM ESTÁ COMEÇANDO
   Primeira tela do sistema. Mostra:
     1) KPIs (total, pendentes, em análise, concluídos e aguardando
        retorno por Área/Cliente);
     2) Indicadores por canal (lista dinâmica da aba Canais — v4.2);
     3) A tabela DINÂMICA de atendimentos do usuário (Analista vê só os
        seus; Supervisor/ADM veem todos — regra aplicada no servidor).

   Tabela dinâmica: a ordem das colunas é sempre
     Data → Cliente → CPF → Produto → Categoria → Responsável →
     campos adicionais (status, aguardando, protocolo, canal e campos
     criados pelo ADM na ConfigCampos) → Ações (sempre a última).
   Campos novos adicionados na configuração aparecem automaticamente,
   sem alteração de código (_colunasTabela lê App.formConfig).

   Edição: o botão "Editar" abre a tela do formulário dinâmico já no canal
   salvo do registro — cada canal pergunta campos diferentes, e isso não
   caberia num modal de campos fixos.

   Tudo vem de UMA única chamada ao servidor (getDashboardData em
   Services.gs), para evitar telas de carregamento em sequência.
   ============================================================ */
Pages.dashboard = {
  state: {
    atendimentos: [],
    filtrados: [],
    termoBusca: '',   // pesquisa rápida (qualquer informação visível)
    filtros: {},      // filtros individuais combináveis (data, produto, etc.)
    pagina: 1,
    // CINCO POR PÁGINA.
    // Com 25, a tabela empurrava a paginação para fora da tela em
    // notebook: para trocar de página era preciso rolar até o fim, voltar
    // ao topo e rolar de novo. Com 5, a lista inteira e os controles cabem
    // na primeira dobra de 1366x768, e quem precisa de mais aumenta pelo
    // seletor "por página" — que continua oferecendo 10, 25, 50 e 100.
    porPagina: 5
  },

  // Mapeamento filtro → id do input na tela. As chaves de select/data são
  // comparadas de forma exata; as de texto, por conteúdo parcial.
  _filtroIds: {
    dataInicio: 'dash-f-data-inicio',
    dataFim: 'dash-f-data-fim',
    protocolo: 'dash-f-protocolo',
    cliente: 'dash-f-cliente',
    cpf: 'dash-f-cpf',
    produto: 'dash-f-produto',
    categoria: 'dash-f-categoria',
    subcategoria: 'dash-f-subcategoria', // v4.6
    canal: 'dash-f-canal',
    status: 'dash-f-status',
    situacao: 'dash-f-situacao',
    responsavel: 'dash-f-responsavel'
  },

  // Rótulos exibidos nos "chips" de filtros ativos (mesmos nomes das labels).
  _filtroLabels: {
    dataInicio: 'Data Inicial',
    dataFim: 'Data Final',
    protocolo: 'Protocolo',
    cliente: 'Cliente',
    cpf: 'CPF',
    produto: 'Produto',
    categoria: 'Categoria',
    subcategoria: 'Subcategoria', // v4.6
    canal: 'Canal',
    status: 'Status',
    situacao: 'Aguardando Retorno',
    responsavel: 'Responsável'
  },

  /**
   * Desenha o esqueleto da tela (KPIs, canais, tabela) e dispara o
   * carregamento único de dados do servidor.
   * @param {HTMLElement} container - <main id="app">.
   */
  render: function(container) {
    // Correção de bug (item "cache de filtros"): o objeto state persiste
    // entre navegações da SPA, mas os inputs renascem vazios a cada
    // render. Sem este reset, ao sair e voltar para o Dashboard a tabela
    // continuava filtrada pela última pesquisa, com os campos em branco.
    this.state.termoBusca = '';
    this.state.filtros = {};
    this.state.pagina = 1;

    var dd = App.dropdownData || {};
    var html = '';

    html += '<div class="page-header">';
    html += '  <div>';
    html += '    <h1 class="page-title">' + App.escapeHtml(App.nomeTela('dashboard', 'Dashboard')) + '</h1>';
    html += '    <p style="color: var(--text-secondary, #6c757d); margin: 4px 0 0 0;">Visão geral dos atendimentos</p>';
    html += '  </div>';
    // O botão é um SEGUNDO caminho para a mesma tela — esconder o item do
    // menu não bastava, ele continuava aqui. Sem a permissão, clicar levava
    // a pessoa de volta ao Dashboard com uma recusa: um botão que só serve
    // para dizer não. No banco 4.x não há permissão declarada e ele aparece
    // como sempre apareceu.
    if (!App.usandoPGO5() || AcessoPGO5.podeVerTela('novoAtendimento')) {
      html += '  <button class="btn btn-primary" onclick="App.navigateTo(\'novoAtendimento\')">➕ ' +
        App.escapeHtml(App.nomeTela('novoAtendimento', 'Novo Atendimento')) + '</button>';
    }
    html += '</div>';

    html += '<div class="grid-4" id="dashboard-kpis">';
    for (var i = 0; i < 6; i++) {
      html += '<div class="kpi-card skeleton-loading" style="min-height: 100px;"></div>';
    }
    html += '</div>';

    // Indicadores consolidados por canal (lista dinâmica da aba Canais — v4.2).
    html += '<div id="dashboard-canais" style="margin-top:24px;"></div>';

    // ── Painel de filtros individuais (recolhível) ──
    // Padrão de UI de sistema: o painel inicia RECOLHIDO (não rouba espaço
    // da tabela); o cabeçalho mostra um contador de filtros ativos e os
    // filtros aplicados aparecem como "chips" removíveis individualmente,
    // visíveis mesmo com o painel fechado. Todos os filtros são
    // combináveis (E lógico) e aplicados sobre a lista já carregada —
    // sem novas chamadas ao servidor (performance).
    html += '<div class="card" style="margin-top:24px;">';
    html += '  <div class="filtros-header" id="dashboard-filtros-toggle" title="Mostrar/ocultar filtros">';
    html += '    <div style="display:flex;align-items:center;gap:10px;">';
    html += '      <h2 style="margin:0;font-size:1.05rem;font-weight:600;">🔍 Filtros</h2>';
    html += '      <span id="dashboard-filtros-badge" class="filtros-badge" style="display:none;">0</span>';
    html += '    </div>';
    html += '    <div style="display:flex;align-items:center;gap:10px;">';
    html += '      <button class="btn btn-secondary" id="dashboard-limpar-filtros" style="display:none;">🗑️ Limpar Filtros</button>';
    html += '      <span class="material-icons filtros-caret">expand_more</span>';
    html += '    </div>';
    html += '  </div>';
    // Chips dos filtros ativos (cada um removível pelo "x").
    html += '  <div id="dashboard-filtros-chips" class="filter-chips"></div>';
    html += '  <div id="dashboard-filtros-wrap" class="filtros-wrap">';
    html += '  <div class="dashboard-filtros">';
    html += '    <div class="form-group"><label class="form-label">Data Inicial</label><input type="date" id="dash-f-data-inicio" class="form-control"></div>';
    html += '    <div class="form-group"><label class="form-label">Data Final</label><input type="date" id="dash-f-data-fim" class="form-control"></div>';
    html += '    <div class="form-group"><label class="form-label">Protocolo</label><input type="text" id="dash-f-protocolo" class="form-control" placeholder="Nº do protocolo"></div>';
    html += '    <div class="form-group"><label class="form-label">Cliente</label><input type="text" id="dash-f-cliente" class="form-control" placeholder="Nome do cliente"></div>';
    html += '    <div class="form-group"><label class="form-label">CPF</label><input type="text" id="dash-f-cpf" class="form-control" placeholder="CPF"></div>';
    html += '    <div class="form-group"><label class="form-label">Produto</label><select id="dash-f-produto" class="form-control"></select></div>';
    html += '    <div class="form-group"><label class="form-label">Categoria</label><select id="dash-f-categoria" class="form-control"></select></div>';
    html += '    <div class="form-group"><label class="form-label">Subcategoria</label><select id="dash-f-subcategoria" class="form-control"></select></div>';
    html += '    <div class="form-group"><label class="form-label">Canal</label><select id="dash-f-canal" class="form-control"></select></div>';
    html += '    <div class="form-group"><label class="form-label">Status</label><select id="dash-f-status" class="form-control"></select></div>';
    html += '    <div class="form-group"><label class="form-label">Aguardando Retorno</label><select id="dash-f-situacao" class="form-control"></select></div>';
    html += '    <div class="form-group"><label class="form-label">Responsável</label><select id="dash-f-responsavel" class="form-control"></select></div>';
    html += '  </div>';
    html += '  </div>'; // fecha filtros-wrap (área recolhível)
    html += '</div>';

    html += '<div class="card" style="margin-top: 24px;">';
    html += '  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">';
    html += '    <h2 style="margin:0;font-size:1.15rem;font-weight:600;">Atendimentos <span id="dashboard-contagem" class="badge" style="font-size:13px;vertical-align:middle;">0</span></h2>';
    html += '    <div class="search-box" style="max-width:340px;flex:1;">';
    html += '      <input type="text" id="dashboard-busca" class="form-control" placeholder="🔍 Pesquisa rápida em qualquer campo...">';
    html += '    </div>';
    html += '  </div>';

    // ── Filtros rápidos (atalhos de um clique) ──
    // Combinações mais usadas no dia a dia do analista; "Meus pendentes"
    // só aparece se o usuário logado estiver na lista de responsáveis.
    html += '  <div class="quick-filters" id="dashboard-atalhos">';
    var meuNome = (App.user || {}).nome || '';
    if (meuNome && (dd.responsaveis || []).indexOf(meuNome) !== -1) {
      html += '<button class="quick-filter-btn" onclick="Pages.dashboard._atalho(\'meus\')">📌 Meus pendentes</button>';
    }
    html += '<button class="quick-filter-btn" onclick="Pages.dashboard._atalho(\'aguardCliente\')">👤 Aguardando Cliente</button>';
    html += '<button class="quick-filter-btn" onclick="Pages.dashboard._atalho(\'aguardArea\')">🏢 Aguardando Área</button>';
    html += '<button class="quick-filter-btn" onclick="Pages.dashboard._atalho(\'hoje\')">📅 Abertos hoje</button>';
    html += '<button class="quick-filter-btn" onclick="Pages.dashboard._atalho(\'todos\')">✨ Todos</button>';
    html += '  </div>';
    html += '  <div id="dashboard-tabela">' + Components.emptyState('sync', 'Carregando atendimentos...') + '</div>';
    html += '  <div id="dashboard-paginacao"></div>';
    html += '</div>';

    container.innerHTML = html;

    // Preenche os selects dos filtros com as listas do bootstrap.
    App.fillSelect('dash-f-produto', dd.produtos || [], 'Todos');
    App.fillSelect('dash-f-categoria', dd.categorias || [], 'Todas');
    App.fillSelect('dash-f-subcategoria', dd.subcategorias || [], 'Todas'); // v4.6
    App.fillSelect('dash-f-canal', dd.canais || [], 'Todos');
    App.fillSelect('dash-f-status', dd.status || [], 'Todos');
    App.fillSelect('dash-f-situacao', dd.situacoesPendencia || [], 'Todas');
    App.fillSelect('dash-f-responsavel', dd.responsaveis || [], 'Todos');

    this._bindFiltros();
    this.carregarDados();
  },

  /**
   * Liga os eventos do painel de filtros e da pesquisa rápida.
   * Selects e datas aplicam na hora; campos de texto usam debounce para
   * não refiltar a cada tecla. Tudo é local (sem chamadas ao servidor).
   */
  _bindFiltros: function() {
    var self = this;
    var timer = null;

    // Aplica os filtros atuais: lê os inputs, volta para a página 1 e
    // redesenha a tabela.
    var aplicar = function() {
      self._lerFiltros();
      self.state.pagina = 1;
      self.filtrarLocal();
      self.renderizarTabela();
      self._renderChips(); // atualiza chips + contador de filtros ativos
    };
    var aplicarComDebounce = function() {
      clearTimeout(timer);
      timer = setTimeout(aplicar, 300);
    };

    Object.keys(self._filtroIds).forEach(function(key) {
      var el = document.getElementById(self._filtroIds[key]);
      if (!el) return;
      if (el.tagName === 'SELECT' || el.type === 'date') {
        el.addEventListener('change', aplicar);
      } else {
        el.addEventListener('input', aplicarComDebounce);
      }
    });

    // Máscara de CPF no filtro (mesma máscara do formulário).
    var cpf = document.getElementById('dash-f-cpf');
    if (cpf) cpf.addEventListener('input', function() { App.maskCPF(this); });

    // Pesquisa rápida: localiza por QUALQUER informação visível na tabela
    // (campos base, status, canal, observações e campos personalizados).
    var busca = document.getElementById('dashboard-busca');
    if (busca) {
      busca.addEventListener('input', function() {
        clearTimeout(timer);
        var termo = this.value;
        timer = setTimeout(function() {
          self.state.termoBusca = termo;
          self.state.pagina = 1;
          self.filtrarLocal();
          self.renderizarTabela();
        }, 250);
      });
    }

    // Abre/recolhe o painel ao clicar no cabeçalho (o botão Limpar não
    // alterna o painel — stopPropagation via verificação do alvo).
    var header = document.getElementById('dashboard-filtros-toggle');
    var wrap = document.getElementById('dashboard-filtros-wrap');
    if (header && wrap) {
      header.addEventListener('click', function(e) {
        if (e.target.closest('#dashboard-limpar-filtros')) return;
        var aberto = wrap.classList.toggle('open');
        header.classList.toggle('open', aberto);
      });
    }

    // Limpar Filtros: zera TODOS os campos e o estado interno, devolvendo
    // a tabela ao estado original (correção do bug de pesquisa retida).
    var limpar = document.getElementById('dashboard-limpar-filtros');
    if (limpar) {
      limpar.addEventListener('click', function() {
        Object.keys(self._filtroIds).forEach(function(key) {
          var el = document.getElementById(self._filtroIds[key]);
          if (el) el.value = '';
        });
        var buscaEl = document.getElementById('dashboard-busca');
        if (buscaEl) buscaEl.value = '';
        self.state.termoBusca = '';
        self.state.filtros = {};
        self.state.pagina = 1;
        self.filtrarLocal();
        self.renderizarTabela();
        self._renderChips();
      });
    }
  },

  /**
   * Desenha os "chips" dos filtros ativos abaixo do cabeçalho do painel
   * (visíveis mesmo com o painel recolhido) e atualiza o contador e a
   * visibilidade do botão Limpar Filtros. Cada chip pode ser removido
   * individualmente pelo "x", sem abrir o painel.
   */
  _renderChips: function() {
    var self = this;
    var container = document.getElementById('dashboard-filtros-chips');
    var badge = document.getElementById('dashboard-filtros-badge');
    var limpar = document.getElementById('dashboard-limpar-filtros');
    if (!container) return;

    var f = self.state.filtros || {};
    var ativos = Object.keys(self._filtroIds).filter(function(key) { return f[key]; });

    container.innerHTML = ativos.map(function(key) {
      var valor = f[key];
      // Datas são exibidas no padrão brasileiro dentro do chip.
      if (key === 'dataInicio' || key === 'dataFim') valor = App.formatDateBR(valor);
      return '<span class="filter-chip">' + self._filtroLabels[key] + ': ' +
        '<strong>' + App.escapeHtml(valor) + '</strong>' +
        '<span class="material-icons" title="Remover este filtro" ' +
        'onclick="Pages.dashboard._removerFiltro(\'' + key + '\')">close</span></span>';
    }).join('');

    if (badge) {
      badge.textContent = ativos.length;
      badge.style.display = ativos.length ? '' : 'none';
    }
    if (limpar) limpar.style.display = ativos.length ? '' : 'none';
  },

  /**
   * Remove UM filtro específico (clique no "x" do chip): limpa o input
   * correspondente e refiltra a tabela na hora.
   * @param {string} key - Chave do filtro em _filtroIds.
   */
  _removerFiltro: function(key) {
    var el = document.getElementById(this._filtroIds[key]);
    if (el) el.value = '';
    this._lerFiltros();
    this.state.pagina = 1;
    this.filtrarLocal();
    this.renderizarTabela();
    this._renderChips();
  },

  /** Lê os valores atuais dos inputs de filtro para o estado da página. */
  _lerFiltros: function() {
    var self = this;
    var filtros = {};
    Object.keys(self._filtroIds).forEach(function(key) {
      var el = document.getElementById(self._filtroIds[key]);
      filtros[key] = el ? String(el.value || '').trim() : '';
    });
    self.state.filtros = filtros;
  },

  /**
   * Busca KPIs + indicadores por canal + atendimentos em UMA chamada
   * (getDashboardData) e desenha tudo.
   */
  carregarDados: function(tentativa) {
    var self = this;
    // Fallback automático (sem loop infinito): na 1ª falha, repete UMA vez
    // com { forceRefresh: true } — o servidor descarta o cache e lê o
    // Google Sheets diretamente (fonte oficial). Só depois disso o erro é
    // mostrado — e SEM apagar dados já exibidos na tela.
    tentativa = tentativa || 1;

    google.script.run
      .withSuccessHandler(function(data) {
        // Resposta sem a estrutura esperada = falha (não "0 registros"):
        // aciona o mesmo fallback em vez de exibir uma tela vazia.
        if (!data || !Array.isArray(data.atendimentos)) {
          console.error('[Dashboard] Resposta inválida do servidor:', data);
          self._falhaCarregamento(tentativa, { message: 'Resposta inválida do servidor.' });
          return;
        }
        self.state.atendimentos = data.atendimentos;
        self.state.pagina = 1;
        self.filtrarLocal();
        self.renderizarKPIs(data.cards, data.porSituacao);
        self.renderizarCanais(data.porCanal);
        self.renderizarTabela();
        // Só confirma quando houve RECUPERAÇÃO após uma falha real (2ª
        // tentativa bem-sucedida). No fluxo normal (1ª tentativa) nada é
        // exibido — carregamento silencioso.
        if (tentativa > 1) {
          Components.toast('Dados atualizados a partir do Google Sheets. ✓', 'success');
        }
        // VISÃO PARCIAL: o servidor conseguiu ler parte das abas, mas não
        // todas. Os dados exibidos estão INCOMPLETOS — o usuário precisa
        // saber disso explicitamente (nunca apresentar número parcial como
        // se fosse total).
        if (data.parcial) {
          Components.toast('Atenção: não foi possível ler ' +
            (data.abasIndisponiveis || []).join(', ') +
            '. A lista está incompleta — use "Atualizar" em instantes.', 'warning', 8000);
        }
      })
      .withFailureHandler(function(erro) {
        self._falhaCarregamento(tentativa, erro);
      })
      .getDashboardData(tentativa > 1 ? { forceRefresh: true } : null);
  },

  /**
   * Tratamento central de falha do carregamento do Dashboard.
   * 1ª falha → registra o contexto técnico e tenta o fallback (Sheets
   * direto, sem cache). 2ª falha → mostra o estado de ERRO com botão
   * "Tentar novamente" — visual DIFERENTE de "Nenhum atendimento
   * encontrado" (erro nunca se disfarça de base vazia) — e preserva a
   * tabela anterior se já havia dados na tela.
   * @param {number} tentativa - Número da tentativa que falhou.
   * @param {Object} erro - Erro recebido do failure handler.
   */
  _falhaCarregamento: function(tentativa, erro) {
    var msg = (erro && erro.message) || 'erro desconhecido';
    console.error('[Dashboard] Falha ao carregar (tentativa ' + tentativa + '):', msg);

    if (tentativa === 1) {
      // Retentativa SILENCIOSA: a maioria das falhas é transitória e se
      // resolve na 2ª tentativa (com forceRefresh). Não exibimos mais o
      // aviso aqui — ele assustava o usuário mesmo quando tudo se
      // recuperava sozinho. O erro fica registrado no console para
      // diagnóstico; só a falha DEFINITIVA (2ª tentativa) vira mensagem.
      this.carregarDados(2); // fallback: força leitura da fonte oficial
      return;
    }

    Components.toast('Erro ao carregar o dashboard: ' + msg, 'error', 6000);

    // Preserva a interface: se já existem dados na tela, mantém.
    if (this.state.atendimentos.length > 0) return;

    var estadoErro = '<div class="empty-state">' +
      '<span class="material-icons" style="color:var(--danger,#E53935)">cloud_off</span>' +
      '<div class="empty-state-title">Não foi possível carregar os atendimentos.</div>' +
      '<div class="empty-state-message">Os registros continuam seguros no Google Sheets — houve uma falha temporária de leitura.</div>' +
      '<button class="btn btn-primary" style="margin-top:12px;" onclick="Pages.dashboard.carregarDados()">🔄 Tentar novamente</button>' +
      '</div>';
    var kpiContainer = document.getElementById('dashboard-kpis');
    if (kpiContainer) {
      kpiContainer.innerHTML = Components.emptyState('error_outline', 'Não foi possível carregar os indicadores.');
    }
    var tabela = document.getElementById('dashboard-tabela');
    if (tabela) tabela.innerHTML = estadoErro;
  },

  /**
   * Preenche os cartões de resumo (KPIs) do topo.
   * @param {Object} cards - Totais gerais.
   * @param {Object} porSituacao - Pendentes por "Aguardando Retorno de".
   */
  renderizarKPIs: function(cards, porSituacao) {
    var container = document.getElementById('dashboard-kpis');
    if (!container) return;
    cards = cards || {};
    porSituacao = porSituacao || {};

    // KPIs clicáveis: um toque no cartão aplica o filtro correspondente
    // na tabela e rola até ela (menos digitação para o analista).
    var html = '';
    html += Components.kpiCard('assignment', App.formatNumber(cards.totalAtendimentos || 0), 'Total de Atendimentos', '#0046C0', null,
      "Pages.dashboard.filtrarPorKpi('')");
    html += Components.kpiCard('hourglass_empty', App.formatNumber(cards.pendentes || 0), 'Pendentes', '#FF9800', null,
      "Pages.dashboard.filtrarPorKpi('Pendente')");
    // Sem descrição: o card mostra só "Em análise".
    // A frase explicativa existia para tirar dúvida sobre o status, mas com
    // os cards compactos ela não cabia inteira e aparecia cortada — texto
    // pela metade explica menos que rótulo nenhum, e ainda era o card que
    // esticava a altura de toda a faixa.
    html += Components.kpiCard('person_search', App.formatNumber(cards.emAnalise || 0), 'Em análise', '#2196F3', null,
      "Pages.dashboard.filtrarPorKpi('Em análise')");
    html += Components.kpiCard('check_circle', App.formatNumber(cards.concluidos || 0), 'Concluídos', '#43A047', null,
      "Pages.dashboard.filtrarPorKpi('Concluído')");

    var situacaoIcones = { 'Área': 'apartment', 'Cliente': 'person' };
    var situacaoCores = { 'Área': '#9C27B0', 'Cliente': '#00A3E0' };
    Object.keys(porSituacao).forEach(function(situacao) {
      html += Components.kpiCard(
        situacaoIcones[situacao] || 'pending_actions',
        App.formatNumber(porSituacao[situacao] || 0),
        'Aguardando Retorno — ' + situacao,
        situacaoCores[situacao] || '#607D8B',
        null,
        "Pages.dashboard.filtrarPorKpi('Pendente','" + App.escapeHtml(situacao) + "')"
      );
    });

    container.innerHTML = html;
  },

  /**
   * Indicadores por canal: total, pendentes, em análise e concluídos de
   * cada canal, com barras proporcionais.
   * @param {Object} porCanal - { canal: { total, pendentes, ... } }.
   */
  renderizarCanais: function(porCanal) {
    var container = document.getElementById('dashboard-canais');
    if (!container) return;
    porCanal = porCanal || {};
    var canais = Object.keys(porCanal);
    if (!canais.length) {
      container.innerHTML = '';
      return;
    }

    var series = [
      { key: 'pendentes', label: 'Pendentes', cor: '#FF9800' },
      { key: 'emAnalise', label: 'Em análise', cor: '#2196F3' },
      { key: 'concluidos', label: 'Concluídos', cor: '#43A047' }
    ];

    var html = '<div class="card">';
    html += '<h2 style="margin:0 0 16px 0;font-size:1.15rem;font-weight:600;">Atendimentos por Canal</h2>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;">';

    canais.forEach(function(canal) {
      var dados = porCanal[canal] || {};
      var total = Number(dados.total || 0);
      html += '<div style="border:1px solid var(--border,#e0e0e0);border-radius:8px;padding:16px;">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
      html += '<strong style="font-size:14px;">' + App.escapeHtml(canal) + '</strong>';
      html += '<span class="badge">' + App.formatNumber(total) + ' total</span>';
      html += '</div>';

      series.forEach(function(serie) {
        var valor = Number(dados[serie.key] || 0);
        var pct = total > 0 ? Math.round((valor / total) * 100) : 0;
        html += '<div style="margin-bottom:8px;">';
        html += '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;">';
        html += '<span>' + serie.label + '</span><span>' + App.formatNumber(valor) + '</span>';
        html += '</div>';
        html += '<div style="background:var(--border-light,#eceff1);border-radius:4px;height:8px;overflow:hidden;">';
        html += '<div style="width:' + pct + '%;height:100%;background:' + serie.cor + ';"></div>';
        html += '</div>';
        html += '</div>';
      });

      html += '</div>';
    });

    html += '</div></div>';
    container.innerHTML = html;
  },

  /**
   * Filtra a lista carregada combinando (E lógico) os filtros individuais
   * do painel com a pesquisa rápida — tudo client-side, sobre os dados já
   * carregados (nenhuma leitura extra da planilha).
   *
   * Regras de negócio:
   *  - Data Inicial/Final: comparadas com a data de abertura (inclusivas);
   *  - Produto, Categoria, Canal, Status, Aguardando Retorno e
   *    Responsável: comparação exata (selects);
   *  - Protocolo e Cliente: comparação parcial (contém);
   *  - CPF: comparado apenas pelos dígitos (ignora pontuação);
   *  - Pesquisa rápida: localiza o termo em QUALQUER informação visível
   *    (campos base + campos personalizados da ConfigCampos).
   */
  filtrarLocal: function() {
    var f = this.state.filtros || {};
    var termo = (this.state.termoBusca || '').toLowerCase().trim();

    // Normalizações calculadas uma única vez (fora do loop) por performance.
    var norm = function(v) { return String(v === undefined || v === null ? '' : v).toLowerCase().trim(); };
    var dataInicio = f.dataInicio ? App.parseDate(f.dataInicio) : null;
    var dataFim = f.dataFim ? App.parseDate(f.dataFim) : null;
    if (dataFim) dataFim.setHours(23, 59, 59, 999); // fim do dia (inclusivo)
    var cpfFiltro = f.cpf ? String(f.cpf).replace(/\D/g, '') : '';

    this.state.filtrados = this.state.atendimentos.filter(function(item) {
      // ── Período (data de abertura) ──
      if (dataInicio || dataFim) {
        var aberta = App.parseDate(item.dataAbertura);
        if (dataInicio && (!aberta || aberta < dataInicio)) return false;
        if (dataFim && (!aberta || aberta > dataFim)) return false;
      }

      // ── Filtros exatos (selects) ──
      if (f.produto && norm(item.produto) !== norm(f.produto)) return false;
      if (f.categoria && norm(item.categoria) !== norm(f.categoria)) return false;
      // v4.6: atendimentos antigos têm subcategoria vazia — só são
      // descartados quando o filtro de subcategoria está ativo.
      if (f.subcategoria && norm(item.subcategoria) !== norm(f.subcategoria)) return false;
      if (f.canal && norm(item.canal) !== norm(f.canal)) return false;
      if (f.status && norm(item.status) !== norm(f.status)) return false;
      if (f.situacao && norm(item.situacaoPendencia) !== norm(f.situacao)) return false;
      if (f.responsavel && norm(item.responsavel) !== norm(f.responsavel)) return false;

      // ── Filtros parciais (texto) ──
      if (f.protocolo && norm(item.numeroRA).indexOf(norm(f.protocolo)) === -1) return false;
      if (f.cliente && norm(item.cliente).indexOf(norm(f.cliente)) === -1) return false;
      if (cpfFiltro && String(item.cpf || '').replace(/\D/g, '').indexOf(cpfFiltro) === -1) return false;

      // ── Pesquisa rápida (qualquer informação visível) ──
      if (termo) {
        var campos = [item.numeroRA, item.cliente, item.cpf, item.produto, item.categoria,
          item.subcategoria, // v4.6
          item.status, item.situacaoPendencia, item.responsavel, item.canal, item.observacoes];
        // Inclui os valores dos campos personalizados na busca.
        var extras = item.camposExtras || {};
        Object.keys(extras).forEach(function(key) { campos.push(extras[key]); });
        var achou = campos.some(function(campo) {
          return campo && String(campo).toLowerCase().indexOf(termo) !== -1;
        });
        if (!achou) return false;
      }

      return true;
    });

    var badge = document.getElementById('dashboard-contagem');
    if (badge) badge.textContent = App.formatNumber(this.state.filtrados.length);
  },

  /**
   * Monta as colunas da tabela dinamicamente.
   * Ordem obrigatória: Data, Cliente, CPF, Produto, Categoria,
   * Responsável; depois os campos de fluxo (Status, Aguardando Retorno)
   * e qualquer outro campo visível da ConfigCampos (protocolo, canal,
   * observações e campos criados pelo ADM). A coluna Ações é adicionada
   * automaticamente pelo Components.dataTable como última.
   * @returns {Object[]} Colunas { campo, label, base }.
   */
  _colunasTabela: function() {
    // BANCO PGO 5.0 — Dashboard compacto (Etapa 5).
    //
    // POR QUE AGRUPAR
    // Eram 10 colunas independentes: a tabela ficava mais larga que
    // qualquer tela e o usuário rolava para o lado o tempo todo. As
    // informações continuam TODAS visíveis, só que reunidas em 5 grupos
    // que fazem sentido juntos — mais Ações, que o dataTable acrescenta.
    //
    // Nada disso muda o banco: é composição visual em cima dos mesmos
    // campos que já vinham do servidor.
    if (App.usandoPGO5 && App.usandoPGO5()) {
      return [
        { campo: '_grupoAtendimento', label: 'Atendimento', base: true },
        { campo: '_grupoCliente', label: 'Cliente', base: true },
        { campo: '_grupoClassificacao', label: 'Classificação', base: true },
        { campo: '_grupoResponsavel', label: 'Responsável', base: true },
        { campo: '_grupoObservacoes', label: 'Observações', base: true }
      ];
    }

    var fixas = [
      { campo: 'dataAbertura', label: 'Data', base: true },
      // Coluna virtual "Aberto há": idade do caso em dias, com badge de
      // cor gradual — destaca os casos que precisam de mais atenção sem
      // alarmar (tons suaves). Concluídos mostram "—".
      { campo: '_idade', label: 'Aberto há', base: true },
      { campo: 'cliente', label: 'Cliente', base: true },
      { campo: 'cpf', label: 'CPF', base: true },
      { campo: 'produto', label: 'Produto', base: true },
      { campo: 'categoria', label: 'Categoria', base: true },
      { campo: 'responsavel', label: 'Responsável', base: true }
    ];
    var chavesFixas = fixas.map(function(c) { return c.campo; });

    // Campos de fluxo sempre exibidos após as colunas fixas.
    var adicionais = [
      { campo: 'status', label: 'Status', base: true },
      { campo: 'situacaoPendencia', label: 'Aguardando Retorno', base: true }
    ];

    // Demais campos visíveis da configuração (novos campos aparecem
    // automaticamente aqui, sem alteração de código).
    (App.formConfig || []).forEach(function(field) {
      if (!field || !field.exibir) return;
      if (chavesFixas.indexOf(field.campo) !== -1) return;
      adicionais.push({ campo: field.campo, label: field.rotulo, base: !!field.base });
    });

    return fixas.concat(adicionais);
  },

  /**
   * Valor exibido de uma célula, conforme o tipo da coluna.
   * @param {Object} item - Atendimento (formato do cliente).
   * @param {Object} col - Coluna de _colunasTabela().
   * @returns {string} HTML seguro da célula.
   */
  _valorCelula: function(item, col) {
    // Grupos do Dashboard compacto (PGO 5.0).
    if (col.campo === '_grupoAtendimento') return this._grupoAtendimento(item);
    if (col.campo === '_grupoCliente') return this._grupoCliente(item);
    if (col.campo === '_grupoClassificacao') return this._grupoClassificacao(item);
    if (col.campo === '_grupoResponsavel') return this._grupoResponsavel(item);
    if (col.campo === '_grupoObservacoes') return this._grupoObservacoes(item);

    if (col.campo === 'dataAbertura') return App.formatDateBR(item.dataAbertura);
    if (col.campo === '_idade') return this._badgeIdade(item);
    if (col.campo === 'status') return Components.statusBadge(item.status, item.statusCor || null);
    if (col.campo === 'situacaoPendencia') return App.escapeHtml(item.situacaoPendencia || '—');
    if (col.campo === 'cliente') return App.escapeHtml(item.cliente || '');
    if (col.campo === 'numeroRA') {
      return item.numeroRA ? ('<strong>' + App.escapeHtml(item.numeroRA) + '</strong>') : '—';
    }

    var valor = col.base ? item[col.campo] : (item.camposExtras || {})[col.campo];
    valor = valor === undefined || valor === null ? '' : String(valor);
    if (!valor) return '—';
    // Textos longos (ex.: assunto/observações): a célula mostra os
    // primeiros 40 caracteres com "…"; o clique abre um modal com o
    // conteúdo COMPLETO, selecionável e com botão de copiar
    // (Components.longText — mesmo comportamento em todas as tabelas).
    return Components.longText(valor, 40);
  },

  /**
   * Grupo "Atendimento": protocolo em destaque, data, idade, canal e o
   * badge de status.
   *
   * O status usa Components.statusBadge, que escolhe a cor do texto pela
   * luminância do fundo — assim qualquer cor que o ADM configurar continua
   * legível (correção da Etapa 4, não voltar para branco fixo).
   *
   * @param {Object} item Atendimento no formato do cliente.
   * @returns {string} HTML seguro da célula.
   */
  _grupoAtendimento: function(item) {
    var protocolo = item.numeroRA
      ? '<span class="dash-protocolo">' + App.escapeHtml(item.numeroRA) + '</span>'
      : '<span class="dash-vazio">Sem protocolo</span>';

    var data = App.formatDateBR(item.dataAbertura) || '—';
    var idade = this._textoIdade(item);
    var linhaData = App.escapeHtml(data) + (idade ? ' <span class="dash-sep">•</span> ' + idade : '');

    var canal = item.canal
      ? '<div class="dash-canal">' + App.escapeHtml(item.canal) + '</div>'
      : '';

    // O status vem do CATÁLOGO (com a cor configurada), nunca de uma lista
    // fixa no código — canais e status novos aparecem sozinhos aqui.
    var status = Components.statusBadge(item.status, item.statusCor || null);

    return '<div class="dash-grupo">' + protocolo +
      '<div class="dash-linha-secundaria">' + linhaData + '</div>' +
      canal + '<div class="dash-status">' + status + '</div></div>';
  },

  /**
   * Grupo "Cliente": nome e CPF.
   *
   * ⚠️ O CPF é exibido EXATAMENTE como está gravado. Ele é um
   * identificador em texto e pode ser "0" ou "00123" — aplicar máscara ou
   * converter para número apagaria os zeros à esquerda e mudaria o
   * identificador (ver a regra de CPF no README).
   *
   * @param {Object} item Atendimento no formato do cliente.
   * @returns {string} HTML seguro da célula.
   */
  _grupoCliente: function(item) {
    var nome = item.cliente
      ? '<div class="dash-cliente-nome">' + App.escapeHtml(item.cliente) + '</div>'
      : '<div class="dash-vazio">Sem cliente</div>';

    // Comparar com '' (e não com !item.cpf) porque "0" é um CPF VÁLIDO e
    // seria descartado por um teste de valor falsy.
    var cpf = String(item.cpf === undefined || item.cpf === null ? '' : item.cpf);
    var linhaCpf = cpf !== ''
      ? '<div class="dash-cpf">CPF: ' + App.escapeHtml(cpf) + '</div>'
      : '<div class="dash-vazio">Sem CPF</div>';

    return '<div class="dash-grupo">' + nome + linhaCpf + '</div>';
  },

  /**
   * Grupo "Classificação": Produto → Categoria → Subcategoria em cascata.
   *
   * Cada nível só aparece quando existe. Um atendimento sem classificação
   * mostra "Sem classificação" — nunca "undefined" ou "[object Object]".
   *
   * @param {Object} item Atendimento no formato do cliente.
   * @returns {string} HTML seguro da célula.
   */
  _grupoClassificacao: function(item) {
    var niveis = [item.produto, item.categoria, item.subcategoria]
      .map(function(valor) { return String(valor === undefined || valor === null ? '' : valor).trim(); })
      .filter(function(valor) { return valor !== '' && valor !== '-'; });

    if (!niveis.length) return '<div class="dash-grupo"><span class="dash-vazio">Sem classificação</span></div>';

    var html = '<div class="dash-grupo">';
    niveis.forEach(function(nivel, posicao) {
      html += '<div class="dash-classificacao dash-nivel-' + posicao + '">' +
        (posicao > 0 ? '<span class="dash-ramo">└</span> ' : '') +
        App.escapeHtml(nivel) + '</div>';
    });
    return html + '</div>';
  },

  /**
   * Grupo "Responsável": quem responde e de quem se aguarda retorno.
   *
   * "Aguardando" NÃO é status: são informações diferentes e por isso ficam
   * visualmente separadas do badge do grupo Atendimento.
   *
   * @param {Object} item Atendimento no formato do cliente.
   * @returns {string} HTML seguro da célula.
   */
  _grupoResponsavel: function(item) {
    var responsavel = item.responsavel
      ? '<div class="dash-responsavel">' + App.escapeHtml(item.responsavel) + '</div>'
      : '<div class="dash-vazio">Sem responsável</div>';

    // "Aguardando Retorno" só aparece enquanto o caso está PENDENTE: um
    // atendimento em análise ou concluído não está esperando ninguém, e
    // mostrar "Aguardando: Área" ali seria informação errada.
    //
    // O backend também apaga o campo quando o status sai de Pendente
    // (ver aplicarRegraDeAguardandoRetorno_ em Pgo5Atendimentos.gs) — aqui
    // é só a metade visual da mesma regra.
    var aguardando = String(item.situacaoPendencia || '').trim();
    var linhaAguardando = '';
    if (this._estaPendente(item) && aguardando) {
      linhaAguardando = '<div class="dash-aguardando">Aguardando: ' +
        App.escapeHtml(aguardando) + '</div>';
    }

    return '<div class="dash-grupo">' + responsavel + linhaAguardando + '</div>';
  },

  /**
   * Nomes TÉCNICOS dos status, usados para decidir comportamento.
   *
   * Vêm da coluna "Nome" do catálogo e são estáveis: quando o administrador
   * renomeia um status, muda o Rotulo (o que aparece na tela), nunca o
   * Nome. Por isso as regras olham para cá e não para o texto exibido.
   */
  STATUS_TECNICO: { PENDENTE: 'pendente', CONCLUIDO: 'concluido' },

  /**
   * Deixa um texto comparável: sem acento, sem espaços nas pontas, minúsculo.
   * @param {string} texto Texto de entrada.
   * @returns {string} Texto normalizado.
   */
  _semAcento: function(texto) { return App.semAcento(texto); },

  /**
   * Compara o status de um atendimento com um nome técnico.
   *
   * No PGO 5.0 o servidor manda statusNomeTecnico junto com o atendimento e
   * a comparação é EXATA — é a chave estável. No banco 4.x esse campo não
   * existe; ali a comparação cai no rótulo por prefixo, que é exatamente o
   * comportamento que o 4.x sempre teve.
   *
   * @param {Object} item Atendimento no formato do cliente.
   * @param {string} nomeTecnico Valor de STATUS_TECNICO a comparar.
   * @returns {boolean} true quando o status corresponde.
   */
  _statusEh: function(item, nomeTecnico) {
    var tecnico = this._semAcento(item.statusNomeTecnico);
    if (tecnico) return tecnico === nomeTecnico;
    return this._semAcento(item.status).indexOf(nomeTecnico.slice(0, 6)) === 0;
  },

  /**
   * Diz se o atendimento está no status Pendente.
   * @param {Object} item Atendimento no formato do cliente.
   * @returns {boolean} true quando o status é Pendente.
   */
  _estaPendente: function(item) {
    return this._statusEh(item, this.STATUS_TECNICO.PENDENTE);
  },

  /**
   * Diz se o atendimento está Concluído.
   * @param {Object} item Atendimento no formato do cliente.
   * @returns {boolean} true quando o status é Concluído.
   */
  _estaConcluido: function(item) {
    return this._statusEh(item, this.STATUS_TECNICO.CONCLUIDO);
  },

  /**
   * Grupo "Observações": resumo em duas linhas.
   *
   * Components.longText corta o texto e abre o conteúdo COMPLETO num modal
   * ao clique — é o mesmo comportamento já usado nas outras tabelas, então
   * o usuário não precisa aprender nada novo para ler a observação inteira.
   *
   * @param {Object} item Atendimento no formato do cliente.
   * @returns {string} HTML seguro da célula.
   */
  _grupoObservacoes: function(item) {
    var texto = String(item.observacoes === undefined || item.observacoes === null
      ? '' : item.observacoes).trim();
    if (!texto) return '<div class="dash-grupo"><span class="dash-vazio">—</span></div>';
    return '<div class="dash-grupo dash-observacoes">' + Components.longText(texto, 90) + '</div>';
  },

  /**
   * Texto curto da idade do caso ("hoje", "há 3d"), já com a cor de
   * atenção. Usado dentro do grupo Atendimento.
   *
   * @param {Object} item Atendimento no formato do cliente.
   * @returns {string} HTML seguro, ou '' quando não se aplica.
   */
  _textoIdade: function(item) {
    // Caso concluído não tem "idade": ele não está esperando nada.
    if (this._estaConcluido(item)) return '';
    var abertura = App.parseDate(item.dataAbertura);
    if (!abertura) return '';
    var dias = Math.floor((Date.now() - abertura.getTime()) / 86400000);
    if (dias < 0) dias = 0;
    var classe = dias <= 3 ? 'idade-recente' : (dias <= 7 ? 'idade-atencao' : 'idade-critica');
    var rotulo = dias === 0 ? 'hoje' : 'há ' + dias + 'd';
    return '<span class="dash-idade ' + classe + '" title="Aberto há ' + dias + ' dia(s)">' +
      rotulo + '</span>';
  },

  /**
   * Badge de idade do caso ("Aberto há"): quantos dias o atendimento
   * está aberto, com cor gradual e discreta para orientar a priorização
   * sem gerar alarme visual.
   * Regra de negócio: até 3 dias = neutro; 4 a 7 dias = atenção (âmbar
   * suave); acima de 7 dias = crítico (vermelho suave). Casos concluídos
   * não têm idade (exibem "—").
   * @param {Object} item - Atendimento (formato do cliente).
   * @returns {string} HTML seguro do badge.
   */
  _badgeIdade: function(item) {
    // Concluído não precisa de atenção: célula neutra.
    if (this._estaConcluido(item)) return '—';
    var abertura = App.parseDate(item.dataAbertura);
    if (!abertura) return '—';
    var dias = Math.floor((Date.now() - abertura.getTime()) / 86400000);
    if (dias < 0) dias = 0;
    var classe = dias <= 3 ? 'idade-recente' : (dias <= 7 ? 'idade-atencao' : 'idade-critica');
    var rotulo = dias === 0 ? 'hoje' : dias + 'd';
    return '<span class="idade-badge ' + classe + '" title="Aberto há ' + dias + ' dia(s)">' + rotulo + '</span>';
  },

  /**
   * Aplica um filtro a partir do clique em um cartão KPI: um toque
   * filtra a tabela pelo status (e situação, quando for "Aguardando
   * Retorno") e rola suavemente até a lista.
   * @param {string} status - Status a filtrar ('' limpa o filtro).
   * @param {string} situacao - "Aguardando Retorno de" (opcional).
   */
  filtrarPorKpi: function(status, situacao) {
    var st = document.getElementById(this._filtroIds.status);
    var si = document.getElementById(this._filtroIds.situacao);
    if (st) st.value = status || '';
    if (si) si.value = situacao || '';
    this._lerFiltros();
    this.state.pagina = 1;
    this.filtrarLocal();
    this.renderizarTabela();
    this._renderChips();
    // Leva o usuário direto ao resultado.
    var tabela = document.getElementById('dashboard-tabela');
    var card = tabela ? tabela.closest('.card') : null;
    if (card && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },

  /**
   * Filtros rápidos predefinidos (atalhos acima da tabela): aplicam
   * combinações comuns com um clique, reduzindo a carga cognitiva do
   * analista. Cada atalho LIMPA os filtros anteriores antes de aplicar.
   * @param {string} tipo - 'meus' | 'aguardCliente' | 'aguardArea' |
   *                        'hoje' | 'todos'.
   */
  _atalho: function(tipo) {
    var self = this;
    // Zera todos os inputs de filtro (mantém a pesquisa rápida).
    Object.keys(self._filtroIds).forEach(function(key) {
      var el = document.getElementById(self._filtroIds[key]);
      if (el) el.value = '';
    });

    var setar = function(key, valor) {
      var el = document.getElementById(self._filtroIds[key]);
      if (el) el.value = valor;
    };

    if (tipo === 'meus') {
      // Pendentes sob responsabilidade do usuário logado.
      setar('responsavel', (App.user || {}).nome || '');
      setar('status', 'Pendente');
    } else if (tipo === 'aguardCliente') {
      setar('status', 'Pendente');
      setar('situacao', 'Cliente');
    } else if (tipo === 'aguardArea') {
      setar('status', 'Pendente');
      setar('situacao', 'Área');
    } else if (tipo === 'hoje') {
      var hoje = App.toInputDate(new Date());
      setar('dataInicio', hoje);
      setar('dataFim', hoje);
    }
    // 'todos' apenas limpa (inputs já zerados acima).

    this._lerFiltros();
    this.state.pagina = 1;
    this.filtrarLocal();
    this.renderizarTabela();
    this._renderChips();
  },

  /**
   * Desenha a tabela dinâmica paginada com as ações por linha
   * (alterar status, editar em modal, excluir).
   */
  renderizarTabela: function() {
    var self = this;
    var container = document.getElementById('dashboard-tabela');
    var paginacao = document.getElementById('dashboard-paginacao');
    if (!container) return;

    var dados = self.state.filtrados;
    if (!dados.length) {
      container.innerHTML = Components.emptyState('inbox', 'Nenhum atendimento encontrado.');
      if (paginacao) paginacao.innerHTML = '';
      return;
    }

    var totalPaginas = Math.max(1, Math.ceil(dados.length / self.state.porPagina));
    if (self.state.pagina > totalPaginas) self.state.pagina = totalPaginas;
    var inicio = (self.state.pagina - 1) * self.state.porPagina;
    var paginados = dados.slice(inicio, inicio + self.state.porPagina);

    var colunas = self._colunasTabela();
    var headers = colunas.map(function(col) {
      return { label: col.label, field: col.campo, sortable: false };
    });

    var rows = paginados.map(function(item) {
      return {
        cells: colunas.map(function(col) { return self._valorCelula(item, col); }),
        id: item.id,
        raw: item
      };
    });

    // Ordem e ícones alinhados com a linguagem visual de Configurações.
    // "change_circle" em vez de bandeira: bandeira seria lida como
    // prioridade ou marcação, não como troca de situação.
    // Alterar status é uma edição, então segue a permissão de edição. No
    // banco 4.x não existe permissão declarada e as três ações aparecem como
    // sempre apareceram.
    var pgo5 = App.usandoPGO5();
    var podeEditar = !pgo5 || AcessoPGO5.podeAgirEmAtendimento('editar');
    var podeExcluir = !pgo5 || AcessoPGO5.podeAgirEmAtendimento('excluir');

    var actions = [];
    if (podeEditar) {
      actions.push({
        icon: 'edit',
        title: 'Editar',
        tom: 'editar',
        // Edição em modal: o usuário permanece no Dashboard.
        onClick: function(row) { self.abrirEdicao(row.raw); }
      });
      actions.push({
        icon: 'published_with_changes',
        title: 'Alterar status',
        tom: 'status',
        onClick: function(row) { self.alterarStatus(row.raw); }
      });
    }
    if (podeExcluir) {
      actions.push({
        icon: 'delete_outline',
        title: 'Excluir',
        tom: 'excluir',
        onClick: function(row) {
          Components.confirm('Tem certeza que deseja excluir o atendimento ' + App.escapeHtml(row.raw.numeroRA) + '? Esta ação não poderá ser desfeita.', function() {
            self.excluir(row.id);
          });
        }
      });
    }

    container.innerHTML = Components.dataTable({
      headers: headers,
      rows: rows,
      actions: actions,
      // Em tela pequena cada atendimento vira um cartão empilhado. Só o
      // Dashboard usa por enquanto — é a tabela mais larga do sistema.
      cartoes: true
    });

    if (paginacao) {
      // Barra completa: seletor 10/25/50/100, navegação Primeira/Anterior/
      // Próxima/Última e o resumo "Exibindo X até Y de Z registros".
      paginacao.innerHTML = Components.paginationBar({
        pagina: self.state.pagina,
        porPagina: self.state.porPagina,
        total: dados.length,
        onPageChange: function(pagina) {
          self.state.pagina = pagina;
          self.renderizarTabela();
        },
        onPageSizeChange: function(tamanho) {
          self.state.porPagina = tamanho;
          self.state.pagina = 1; // volta ao início ao mudar o tamanho
          self.renderizarTabela();
        }
      });
    }
  },

  /**
   * Abre a edição do atendimento num MODAL, sem sair do Dashboard.
   *
   * O formulário é montado a partir da configuração do canal do registro —
   * o mesmo motor da tela de Novo Atendimento (FormularioPGO5), então um
   * campo criado pelo ADM aparece aqui sozinho, sem alteração de código.
   *
   * POR QUE MODAL, E NÃO OUTRA TELA
   * Quem trabalha na lista costuma corrigir vários registros seguidos. Sair
   * para outra tela e voltar a cada correção custa a posição na lista, os
   * filtros aplicados e a página em que a pessoa estava.
   *
   * @param {Object} atendimento Linha da tabela (formato do cliente).
   */
  abrirEdicao: function(atendimento) {
    var self = this;
    if (!atendimento || !atendimento.id) {
      Components.toast('Não foi possível identificar o atendimento.', 'error');
      return;
    }
    Components.showLoading('Carregando atendimento...');

    // Duas informações são necessárias: o CATÁLOGO (para montar os campos do
    // canal) e o REGISTRO (para preenchê-los). O catálogo quase sempre já
    // está em memória, então na prática só o registro vai ao servidor.
    App.carregarFormularioPGO5(function(catalogo) {
      google.script.run
        .withSuccessHandler(function(registro) {
          Components.hideLoading();
          if (!registro) {
            // Resposta vazia tem três causas, e a diferença importa: o
            // registro foi excluído, está fora do escopo de quem abriu, ou o
            // servidor não tem a função — o que acontece quando a publicação
            // no Apps Script fica incompleta.
            Components.toast('Não foi possível abrir este atendimento. Ele pode ter ' +
              'sido excluído, estar fora do seu acesso, ou o servidor pode estar ' +
              'com a publicação incompleta — peça ao Administrador para executar ' +
              'verificarIntegridadeBuildPGO5.', 'error', 8000);
            return;
          }
          self._modalEdicaoPGO5(atendimento, registro, catalogo);
        })
        .withFailureHandler(function(err) {
          Components.hideLoading();
          Components.toast('Erro ao carregar atendimento: ' +
            ((err && err.message) || ''), 'error');
        })
        .obterAtendimentoPGO5(atendimento.id);
    }, function(err) {
      Components.hideLoading();
      Components.toast('Não foi possível carregar o formulário: ' +
        ((err && err.message) || ''), 'error');
    });
  },

  /**
   * Desenha o modal de edição com os campos do canal do registro.
   *
   * @param {Object} linha Linha da tabela (usada no título).
   * @param {Object} registro Resposta de obterAtendimentoPGO5.
   * @param {Object} catalogo Resposta de getFormularioPGO5.
   */
  _modalEdicaoPGO5: function(linha, registro, catalogo) {
    var self = this;
    var campos = ((catalogo.camposPorCanal || {})[registro.canalId]) || [];
    if (!campos.length) {
      Components.toast('Este canal não possui formulário configurado.', 'warning');
      return;
    }

    var valores = registro.valores || {};
    var estado = {
      produtoId: valores.produto || '',
      categoriaId: valores.categoria || '',
      temProduto: campos.some(function(c) { return c.nome === 'produto'; }),
      // Em edição os padrões do sistema NÃO se aplicam: o registro já tem
      // data e status próprios, e sobrepô-los reescreveria o histórico.
      emEdicao: true
    };

    var body = '<form id="pgo5-modal-form" autocomplete="off"><div class="pgo5-grid">';
    campos.forEach(function(campo) {
      // O Analista não delega: vê o próprio nome, sem seletor editável.
      if (campo.nome === 'responsavel' && !catalogo.podeDelegar) {
        var eu = (catalogo.responsaveis || [])[0];
        body += '<div class="form-group"><label class="form-label">' +
          App.escapeHtml(campo.rotulo) + '</label>' +
          '<input class="form-control" type="text" value="' +
          App.escapeHtml(eu ? eu.rotulo : '') + '" disabled></div>';
        return;
      }
      body += FormularioPGO5.campoHtml(campo, valores[campo.nome], catalogo, estado);
    });
    body += '</div></form>';

    // Campos que saíram da configuração: exibidos como leitura, para o
    // histórico do atendimento não ficar invisível.
    if ((registro.historicos || []).length) {
      body += '<div class="pgo5-historicos"><h3>Campos removidos da configuração</h3><ul>';
      registro.historicos.forEach(function(h) {
        body += '<li><strong>' + App.escapeHtml(h.rotulo) + ':</strong> ' +
          App.escapeHtml(String(h.valor === null || h.valor === undefined ? '' : h.valor)) +
          '</li>';
      });
      body += '</ul></div>';
    }

    Components.modal({
      title: 'Editar atendimento — ' + App.escapeHtml(linha.numeroRA || ''),
      body: body,
      size: 'large',
      confirmText: 'Salvar',
      cancelText: 'Cancelar',
      onConfirm: function() {
        self._salvarEdicaoModalPGO5(linha.id, campos, catalogo);
      }
    });

    // As MESMAS regras da tela cheia: cascata local e Aguardando só em
    // Pendente. Sem elas o modal ofereceria combinações que o servidor
    // depois recusaria.
    self._ligarRegrasDoModal(campos, catalogo, estado);
  },

  /**
   * Liga, dentro do modal, a cascata Produto → Categoria → Subcategoria e a
   * regra do "Aguardando Retorno de".
   *
   * @param {Object[]} campos Campos do canal.
   * @param {Object} catalogo Catálogo do formulário.
   * @param {Object} estado Estado da montagem.
   */
  _ligarRegrasDoModal: function(campos, catalogo, estado) {
    var self = this;

    // Só dígitos em CPF e Protocolo (conforto; o servidor revalida).
    document.querySelectorAll('#pgo5-modal-form .pgo5-so-digitos').forEach(function(campo) {
      campo.addEventListener('input', function() {
        var apenas = campo.value.replace(/\D/g, '');
        if (campo.value !== apenas) campo.value = apenas;
      });
    });

    // A cascata roda LOCAL, sobre o catálogo já carregado: trocar o produto
    // não vai ao servidor.
    var redesenhar = function() {
      var elProduto = document.getElementById('pgo5-campo-produto');
      var elCategoria = document.getElementById('pgo5-campo-categoria');
      estado.produtoId = elProduto ? elProduto.value : '';
      estado.categoriaId = elCategoria ? elCategoria.value : '';
      ['categoria', 'subcategoria'].forEach(function(nome) {
        var campo = campos.find(function(c) { return c.nome === nome; });
        if (!campo) return;
        var grupo = document.querySelector('#pgo5-modal-form .form-group[data-campo="' + nome + '"]');
        if (!grupo) return;
        var label = grupo.querySelector('.form-label');
        grupo.innerHTML = (label ? label.outerHTML : '') +
          FormularioPGO5.controleHtml(campo, '', catalogo, estado,
            FormularioPGO5.idDoCampo(campo));
      });
      self._ligarRegrasDoModal(campos, catalogo, estado);
    };

    var selProduto = document.getElementById('pgo5-campo-produto');
    if (selProduto) selProduto.addEventListener('change', redesenhar);
    var selCategoria = document.getElementById('pgo5-campo-categoria');
    if (selCategoria) selCategoria.addEventListener('change', redesenhar);

    // "Aguardando Retorno de" só existe em Pendente — decidido pelo NOME
    // técnico, porque o rótulo é renomeável.
    var selStatus = document.getElementById('pgo5-campo-status');
    var grupoAguardando = document.querySelector('#pgo5-modal-form .form-group[data-campo="aguardandoRetorno"]');
    var sincronizar = function() {
      if (!grupoAguardando) return;
      var escolhido = (catalogo.status || []).find(function(st) {
        return st.id === (selStatus ? selStatus.value : '');
      });
      var ehPendente = !!escolhido && App.semAcento(escolhido.nome) === 'pendente';
      grupoAguardando.style.display = ehPendente ? '' : 'none';
      // Some E limpa: voltando a Pendente, o campo reaparece vazio.
      if (!ehPendente) {
        var campo = document.getElementById('pgo5-campo-aguardandoRetorno');
        if (campo) campo.value = '';
      }
    };
    if (selStatus) selStatus.addEventListener('change', sincronizar);
    sincronizar();
  },

  /**
   * Grava a edição feita no modal e recarrega a lista.
   *
   * @param {string} id Id do atendimento.
   * @param {Object[]} campos Campos do canal.
   * @param {Object} catalogo Catálogo do formulário.
   */
  _salvarEdicaoModalPGO5: function(id, campos, catalogo) {
    var self = this;
    var valores = FormularioPGO5.coletar(campos);
    if (!catalogo.podeDelegar) delete valores.responsavel;

    Components.showLoading('Salvando...');
    google.script.run
      .withSuccessHandler(function() {
        Components.hideLoading();
        Components.toast('Atendimento atualizado. ✓', 'success');
        // Recarrega a lista SEM sair da tela: o usuário continua onde estava.
        self.carregarDados();
      })
      .withFailureHandler(function(err) {
        Components.hideLoading();
        Components.toast(((err && err.message) || 'Não foi possível salvar.'), 'error');
      })
      .atualizarAtendimentoPGO5(id, {
        valores: valores,
        responsavelId: valores.responsavel || ''
      });
  },

  /**
   * Mini-modal para mudar o status/situação sem sair do dashboard.
   * @param {Object} atendimento - Linha da tabela.
   */
  alterarStatus: function(atendimento) {
    var self = this;

    // BANCO PGO 5.0: status e "aguardando" são REGISTROS do catálogo, e a
    // coluna guarda o ID — nunca o texto. O caminho 4.x abaixo trabalha
    // com nomes e continua valendo para as instalações antigas.
    if (App.usandoPGO5 && App.usandoPGO5()) {
      self._alterarStatusPGO5(atendimento);
      return;
    }

    var dd = App.dropdownData || {};
    var statusList = dd.status || ['Pendente', 'Em análise', 'Concluído'];
    var situacoes = dd.situacoesPendencia || ['Área', 'Cliente'];

    var body = '<div class="form-group">';
    body += '<label class="form-label">Status</label>';
    body += '<select id="quick-status" class="form-control">';
    statusList.forEach(function(s) {
      body += '<option value="' + App.escapeHtml(s) + '"' + (atendimento.status === s ? ' selected' : '') + '>' + App.escapeHtml(s) + '</option>';
    });
    body += '</select></div>';
    body += '<div class="form-group" id="quick-situacao-grupo">';
    body += '<label class="form-label">Aguardando Retorno de</label>';
    body += '<select id="quick-situacao" class="form-control">';
    body += '<option value="">Selecione</option>';
    situacoes.forEach(function(s) {
      body += '<option value="' + App.escapeHtml(s) + '"' + (atendimento.situacaoPendencia === s ? ' selected' : '') + '>' + App.escapeHtml(s) + '</option>';
    });
    body += '</select></div>';

    Components.modal({
      title: 'Alterar status — ' + App.escapeHtml(atendimento.numeroRA),
      body: body,
      confirmText: 'Salvar',
      cancelText: 'Cancelar',
      onConfirm: function() {
        var status = document.getElementById('quick-status').value;
        var situacao = document.getElementById('quick-situacao').value;
        if (status === 'Pendente' && !situacao) {
          Components.toast('Informe "Aguardando Retorno de" (Área ou Cliente).', 'warning');
          return false; // mantém o modal aberto para corrigir
        }
        self.salvarStatus(atendimento.id, status, status === 'Pendente' ? situacao : '');
      }
    });

    // Esconde "Aguardando Retorno de" quando o status não é "Pendente".
    var statusSelect = document.getElementById('quick-status');
    var grupoSituacao = document.getElementById('quick-situacao-grupo');
    var syncSituacao = function() {
      if (grupoSituacao) grupoSituacao.style.display = statusSelect.value === 'Pendente' ? '' : 'none';
    };
    if (statusSelect) {
      statusSelect.addEventListener('change', syncSituacao);
      syncSituacao();
    }
  },

  /**
   * Grava a mudança rápida de status e recarrega os dados.
   * @param {string} id - Id do atendimento.
   * @param {string} status - Novo status.
   * @param {string} situacao - "Aguardando Retorno de" (se Pendente).
   */
  salvarStatus: function(id, status, situacao) {
    var self = this;
    Components.showLoading('Atualizando status...');
    google.script.run
      .withSuccessHandler(function(result) {
        Components.hideLoading();
        if (result && result.success) {
          Components.toast('Status atualizado com sucesso!', 'success');
          self.carregarDados();
        } else {
          Components.toast('Não foi possível atualizar o status.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        Components.hideLoading();
        Components.toast('Erro ao atualizar status: ' + err.message, 'error');
      })
      .alterarStatusAtendimento(id, status, situacao);
  },

  /**
   * Exclusão lógica a partir da tabela.
   * @param {string} id - Id do atendimento.
   */
  /**
   * Troca rápida de Status no banco PGO 5.0.
   *
   * As listas vêm do catálogo (não do dropdownData do 4.x) e o que é
   * enviado ao servidor é o ID do registro escolhido. Só status ATIVOS
   * podem ser escolhidos; o valor atual de um caso histórico continua
   * visível mesmo que tenha sido desativado.
   * @param {Object} atendimento - Linha do Dashboard (formato do cliente).
   */
  _alterarStatusPGO5: function(atendimento) {
    var self = this;
    Components.showLoading('Carregando opções...');

    App.carregarFormularioPGO5(function(cat) {
      Components.hideLoading();
      var statusAtivos = cat.status || [];
      var aguardando = cat.aguardando || [];

      // O status atual pode ter sido desativado depois: continua exibido,
      // marcado, para o usuário entender o que o caso tem hoje.
      // O ID do status vem do CATÁLOGO, casando pelo rótulo que a própria
      // linha exibe — os dois saem da mesma fonte, então batem sempre.
      // (Metadados prefixados com "_" não chegam ao cliente: o servidor
      // remove tudo o que começa com underscore antes de enviar.)
      var atualPorRotulo = statusAtivos.find(function(s) { return s.rotulo === atendimento.status; });
      var atualId = atualPorRotulo ? atualPorRotulo.id : '';
      var listaStatus = statusAtivos.slice();
      // Status desativado depois: continua visível para o usuário entender
      // a situação atual, mas não é uma escolha válida de destino.
      if (!atualId && atendimento.status) {
        listaStatus.unshift({ id: '', rotulo: atendimento.status + ' (inativo)' });
      }

      var body = '<div class="form-group"><label class="form-label" for="pgo5-quick-status">Status</label>';
      body += '<select id="pgo5-quick-status" class="form-control">';
      listaStatus.forEach(function(s) {
        body += '<option value="' + App.escapeHtml(s.id) + '"' +
          (s.id === atualId ? ' selected' : '') + '>' + App.escapeHtml(s.rotulo) + '</option>';
      });
      body += '</select></div>';

      body += '<div class="form-group" id="pgo5-quick-aguardando-grupo">' +
        '<label class="form-label" for="pgo5-quick-aguardando">Aguardando Retorno de</label>';
      body += '<select id="pgo5-quick-aguardando" class="form-control"><option value="">Selecione</option>';
      var agAtual = aguardando.find(function(a) { return a.rotulo === atendimento.situacaoPendencia; });
      var aguardandoAtual = agAtual ? agAtual.id : '';
      aguardando.forEach(function(a) {
        body += '<option value="' + App.escapeHtml(a.id) + '"' +
          (a.id === aguardandoAtual ? ' selected' : '') + '>' + App.escapeHtml(a.rotulo) + '</option>';
      });
      body += '</select></div>';

      Components.modal({
        title: 'Alterar status — ' + App.escapeHtml(atendimento.numeroRA || ''),
        body: body,
        confirmText: 'Salvar',
        cancelText: 'Cancelar',
        onConfirm: function() {
          var statusId = document.getElementById('pgo5-quick-status').value;
          // Fora de Pendente o campo está escondido: enviar o que ficou nele
          // gravaria um aguardando que a tela não mostra. O servidor limpa
          // de qualquer forma (aplicarRegraDeAguardandoRetorno_); aqui a
          // tela apenas para de mandar o que não vale.
          var aguardandoId = self._modalEhPendente(statusAtivos)
            ? document.getElementById('pgo5-quick-aguardando').value
            : '';
          self._salvarStatusPGO5(atendimento.id, statusId, aguardandoId);
        }
      });

      // MESMA REGRA DO FORMULÁRIO: "Aguardando Retorno de" só existe em
      // Pendente. Sem isto, o modal continuava oferecendo o campo depois de
      // trocar para Em análise ou Concluído — e a pessoa preenchia algo que
      // o servidor ia descartar, sem entender por quê.
      var seletorStatus = document.getElementById('pgo5-quick-status');
      var grupoAguardando = document.getElementById('pgo5-quick-aguardando-grupo');
      var sincronizar = function() {
        if (!grupoAguardando) return;
        var ehPendente = self._modalEhPendente(statusAtivos);
        grupoAguardando.style.display = ehPendente ? '' : 'none';
        // Some E limpa: voltando a Pendente, o campo reaparece vazio em vez
        // de ressuscitar a escolha anterior.
        if (!ehPendente) {
          var campo = document.getElementById('pgo5-quick-aguardando');
          if (campo) campo.value = '';
        }
      };
      if (seletorStatus) seletorStatus.addEventListener('change', sincronizar);
      sincronizar();
    }, function(err) {
      Components.hideLoading();
      Components.toast('Não foi possível carregar as opções: ' +
        ((err && err.message) || ''), 'error');
    });
  },

  /**
   * Diz se o status escolhido NO MODAL é o Pendente.
   *
   * Compara pelo NOME técnico, nunca pelo rótulo: o administrador pode ter
   * renomeado "Pendente" para qualquer coisa, e a regra tem de continuar
   * valendo.
   *
   * @param {Object[]} statusAtivos Status do catálogo.
   * @returns {boolean} true quando o status escolhido é o Pendente.
   */
  _modalEhPendente: function(statusAtivos) {
    var seletor = document.getElementById('pgo5-quick-status');
    if (!seletor) return false;
    var escolhido = (statusAtivos || []).find(function(s) { return s.id === seletor.value; });
    return !!escolhido && App.semAcento(escolhido.nome) === 'pendente';
  },

  /** Persiste a troca de status no PGO 5.0 (grava ID, nunca texto). */
  _salvarStatusPGO5: function(id, statusId, aguardandoId) {
    var self = this;
    Components.showLoading('Salvando...');
    google.script.run
      .withSuccessHandler(function() {
        Components.hideLoading();
        Components.toast('Status atualizado. ✓', 'success');
        self.carregarDados();
      })
      .withFailureHandler(function(err) {
        Components.hideLoading();
        Components.toast(((err && err.message) || 'Não foi possível alterar o status.'), 'error');
      })
      .alterarStatusAtendimentoPGO5(id, statusId, aguardandoId);
  },

  excluir: function(id) {
    var self = this;
    Components.showLoading('Excluindo atendimento...');

    var aoConcluir = function(result) {
      Components.hideLoading();
      if (result && result.success) {
        Components.toast('Atendimento excluído com sucesso.', 'success');
        self.carregarDados();
      } else {
        Components.toast((result && result.message) || 'Erro ao excluir atendimento.', 'error');
      }
    };
    var aoFalhar = function(err) {
      Components.hideLoading();
      Components.toast('Erro ao excluir: ' + ((err && err.message) || ''), 'error');
    };

    // No PGO 5.0 a exclusão é FÍSICA e remove também os ValoresAtendimento
    // daquele registro — eles pertencem só a ele. Nenhuma configuração é
    // tocada. O caminho 4.x segue com a exclusão lógica de sempre.
    if (App.usandoPGO5 && App.usandoPGO5()) {
      google.script.run.withSuccessHandler(aoConcluir).withFailureHandler(aoFalhar)
        .excluirAtendimentoPGO5(id);
      return;
    }
    google.script.run.withSuccessHandler(aoConcluir).withFailureHandler(aoFalhar)
      .excluirAtendimento(id);
  }
};
</script>
